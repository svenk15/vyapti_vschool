</style></head><body><a class="skip" href="#main">Skip to content</a><div class="reviewbar"><div><strong>VSchool · Teacher · Edition 01</strong><br>Fictional design review · memory only · no backend or authentication</div><details><summary>Review tools</summary><div class="reviewtools"><label>Scope <select id="review-mode"><option value="core">Attendance pilot</option><option value="expanded">Expanded teaching · proposed</option></select></label><label>Palette <select id="review-palette"><option>Forest</option><option>Indigo</option><option>Clay</option></select></label><label>State <select id="review-scenario"><option value="normal">Normal</option><option value="loading">Loading</option><option value="load-error">Load error</option><option value="denied">Access denied</option><option value="expired">Session expired</option><option value="save-failure">Next save fails</option><option value="conflict">Next save conflicts</option><option value="timeout">Attendance result unknown</option></select></label><a href="#/journeys">All 42 workflows</a><button type="button" class="btn quiet small" data-action="reset">Reset review</button></div></details></div><div id="app"></div><dialog id="dialog" class="dialog" aria-labelledby="dialog-title"></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div><div id="announce" class="sr" role="status" aria-live="polite"></div><script>const PACK={
  "edition": "01",
  "status": "UX_DESIGN_PROPOSAL",
  "baseline": "Operator 03.9 and School Administrator 01",
  "scope": "Teacher persona; documented module blueprint with clearly marked proposed extensions",
  "modules": [
    {
      "id": "access",
      "title": "Account & access",
      "icon": "shield",
      "phase": 1,
      "description": "Enter the right school workspace and keep your account secure.",
      "owner": "access, tenancy"
    },
    {
      "id": "today",
      "title": "My teaching day",
      "icon": "home",
      "phase": 1,
      "description": "See the next class and the work that needs attention.",
      "owner": "academics, attendance"
    },
    {
      "id": "classes",
      "title": "My classes",

    },
    {
      "id": "attendance",
      "title": "Attendance",
      "icon": "check",
      "phase": 1,

    },
    {
      "id": "communication",
      "title": "Messages & families",
      "icon": "mail",
      "phase": 2,
      "description": "Communicate through approved audiences and child-specific relationships.",
      "owner": "communication, guardians"
    },
    {
      "id": "planning",
      "title": "Timetable & cover",
      "icon": "calendar",
      "phase": 3,
      "description": "Understand published schedules and explicit temporary teaching assignments.",
      "owner": "academics"
    },
    {
      "id": "learning",
      "title": "Teaching & learning",
      "icon": "book",
      "phase": 3,
      "description": "Plan, assign, review submissions and return useful feedback.",
      "owner": "learning, documents"
    },
    {
      "id": "assessments",
      "title": "Assessments",
      "icon": "chart",
      "phase": 4,
      "description": "Enter marks carefully and participate in controlled moderation and publication.",
      "owner": "assessments"
    },
    {
      "id": "wellbeing",
      "title": "Student support",
      "icon": "heart",
      "phase": 6,
      "description": "Refer concerns through a restricted, accountable route.",
      "owner": "health, safeguarding"
    },
    {
      "id": "self-service",
      "title": "My requests",

    {
      "id": "resources",
      "title": "Resources & facilities",
      "icon": "file",
      "phase": 6,
      "description": "Borrow, request or book permitted teaching resources.",
      "owner": "library, inventory, facilities"
    },
    {
      "id": "duties",
      "title": "Assigned duties",
      "icon": "school",
      "phase": 6,
      "description": "Carry out explicitly assigned school duties with minimal pupil data.",
      "owner": "operations, transport"
    },
    {
      "id": "assistant",
      "title": "Teaching assistant",
      "icon": "spark",
      "phase": 7,
      "description": "Use evidence-based drafts and retain human responsibility for every action.",
      "owner": "assistant"
    }
  ],
  "workflows": [
    {
      "id": "TEA-01",
      "area": "access",
      "title": "Sign in to the school workspace",
      "phase": 1,
      "capability": "active account + branch membership",
      "entry": "sign-in",
      "steps": [
        {
          "title": "School entry",
          "help": "Published school branding helps recognition; it does not grant access.",
          "fields": [
            {
              "name": "email",
              "label": "Email address",
              "type": "email",
              "options": [],
              "required": true,
              "value": ""
            },
            {
              "name": "password",
              "label": "Password",
              "type": "password",
              "options": [],
              "required": true,
              "value": ""
            }
          ]
        },
        {
          "title": "Authorized workspace",
          "help": "Skip branch selection when only one branch is permitted.",
          "fields": [
            {
              "name": "branch",
              "label": "Branch",
              "type": "select",
              "options": [
                "Whitefield",
                "Indiranagar"
              ],
              "required": true,
              "value": ""
            }
          ]
        }
      ],
      "outcome": "My Teaching Day opens in the authorized branch.",
      "rule": "Resolve permissions server-side. A Teacher role alone does not establish employee identity, dated eligibility or class assignment.",
      "recovery": "Generic credential rejection; revoked/suspended access exposes no roster. Safe return URLs only.",
      "data": "Access reads global UserAccount, branch SchoolMembership/RoleGrant and institution/branch state; creates verified session/context.",
      "proposal": false
    },
    {
      "id": "TEA-02",
      "area": "access",
      "title": "Activate or recover a teacher account",
      "phase": 1,
      "capability": "Access activation/recovery policy",
      "entry": "flow/TEA-02",
      "steps": [
        {
          "title": "Account help",

              "name": "email",
              "label": "Account email",
              "type": "email",
              "options": [],
              "required": true,
              "value": ""

              "name": "need",
              "label": "I need to",
              "type": "select",
              "options": [
                "Activate invited account",
                "Reset password"
              ],
              "required": true,
              "value": ""
            }
          ]
        },
        {
          "title": "Next steps",
          "help": "The public response does not disclose whether the account exists.",
          "fields": [
            {
              "name": "ack",
              "label": "I will use the school’s verified recovery instructions.",
              "type": "checkbox",
              "options": [],
              "required": true,
              "value": ""
            }
          ]
        }
      ],
      "outcome": "A generic acknowledgement explains the permitted next step.",
      "rule": "Existing operator-issued and email-issued paths coexist. A stricter active institution can prevent an account-wide email reset at issue and consumption.",
      "recovery": "Expired/revoked/consumed/failed-delivery tokens fail safely. Resend and compromised-inbox recovery use their documented owner workflows.",
      "data": "Access owns token hashes, policy evaluation, single-use consume, session invalidation and sanitized delivery evidence. No secrets in drafts or audit.",
      "proposal": false
    },
    {
      "id": "TEA-03",
      "area": "access",
      "title": "Switch branch or leave the workspace",
      "phase": 1,
      "capability": "active target-branch grant / own session",
      "entry": "account",
      "steps": [
        {
          "title": "Destination",
          "help": "Only authorized branches appear.",
          "fields": [
            {
              "name": "destination",
              "label": "Destination",
              "type": "select",
              "options": [
                "Whitefield",
                "Indiranagar",
                "Sign out"
              ],
              "required": true,
              "value": ""
            }
          ]
        },
        {
          "title": "Unsaved work",
          "help": "An unsubmitted attendance draft is held in memory only in Phase 1.",
          "fields": [
            {
              "name": "leave",
              "label": "I have reviewed unsaved work before leaving.",
              "type": "checkbox",
              "options": [],
              "required": true,
              "value": ""
            }
          ]
        }
      ],
      "outcome": "Context switches after authorization, or the current session ends.",
      "rule": "Warn before discarding input; clear old-branch protected state/caches. A saved or submitted record belongs to its original branch.",
      "recovery": "Permission lost during switch shows a safe destination. Unknown submission must be resolved before the draft is discarded.",
      "data": "Access resolves target scope or revokes session. Business commands and request receipts remain owner-scoped.",
      "proposal": false
    },
    {
      "id": "TEA-04",
      "area": "access",
      "title": "Review my account and sessions",
      "phase": 1,
      "capability": "self.read; self-service session actions must match existing Access contract",
      "entry": "account",
      "steps": [
        {
          "title": "My account",
          "help": "Review only your own safe account and branch memberships.",
          "fields": [
            {
              "name": "view",
              "label": "View",
              "type": "select",
              "options": [
                "Account details",
                "Authorized branches",
                "Session information"
              ],
              "required": true,
              "value": ""
            }
          ]
        },
        {
          "title": "Account action",
          "help": "Role, employee identity and permissions are changed by their authorized owner.",
          "fields": [
            {
              "name": "action",
              "label": "Next action",
              "type": "select",
              "options": [
                "Use password recovery",
                "Contact school administrator",
                "Sign out of this session"
              ],
              "required": true,
              "value": ""
            }
          ]
        }
      ],
      "outcome": "The teacher understands their identity, access and permitted account actions.",
      "rule": "No self-service role escalation, arbitrary branch addition or global identity editing. Listing/revoking other own sessions is an extension unless the repository already supports it.",
      "recovery": "A stale or expired session returns to school sign-in; never disclose token material.",
      "data": "Access self DTO from UserAccount/session/membership; no salary, guardian grant or administrator-only record joins.",
      "proposal": false
    },
    {
      "id": "TEA-05",
      "area": "today",
      "title": "Plan my teaching day",
      "phase": 1,
      "capability": "class.read + assigned attendance capabilities",
      "entry": "today",
      "steps": [
        {
          "title": "Choose the date",
          "help": "The school-local date determines the schedule.",
          "fields": [
            {
              "name": "date",
              "label": "Teaching date",

              "options": [],
              "required": true,
              "value": ""
            }
          ]
        },
        {
          "title": "Next action",
          "help": "Show sessions in time order with their actual state.",
          "fields": [
            {
              "name": "action",

              ],
              "required": true,

            }
          ]
        }

      "outcome": "The teacher reaches the right class with a clear next action.",

      "recovery": "No sessions is a helpful empty state, not evidence of an account failure. Refresh rechecks assignments.",
      "data": "Authorized Offering/Assignment → dated AttendanceSession read model. Include branch zone, as-of time and server-resolved capability.",
      "proposal": false
    },
    {
      "id": "TEA-06",
      "area": "today",
      "title": "Resolve a missing or changed assignment",
      "phase": 1,
      "capability": "self.read + minimal assignment status",
      "entry": "flow/TEA-06",
      "steps": [
        {
          "title": "Readiness",
          "help": "Show the safe reason the teaching day is incomplete.",

            {

      "outcome": "The teacher has a precise, non-sensitive handoff and a retry route.",

      "data": "Read Access/People/Academics readiness through published minimal contracts. Phase 1 handoff is informational, not a new ticket system.",
      "proposal": false
    },
    {

function render(){const rr=r(),[p,id,part]=rr.parts;let body,crumb;const future=(p==='flow'?flow(id)?.phase:area(p)?.phase)||0;if(S.scenario==='loading')body=head('Loading your workspace','Checking your current branch and assignments.')+`<section class="card" role="status">${Array.from({length:6},()=>'<div class="skeleton"></div>').join('')}<span class="sr">Loading</span></section>`;else if(S.scenario==='load-error')body=empty('We couldn’t load this view','Your last submitted records are unchanged.',btn('Try again','normal',true,'refresh'));else if(S.scenario==='expired')body=empty('Your session has expired','Protected draft data has been cleared. Sign in to an authorized workspace again.',btn('Go to school sign-in','expired-login',true));else if(S.scenario==='denied'||db.revoked)body=denied();else if(p==='sign-in'){root.innerHTML=login();applyPalette();return;}else if(future>1&&S.mode==='core')body=head(area(p)?.title||flow(id)?.title||'Teaching tools','A later-phase teaching capability.')+note('Available in expanded design review','This tool stays out of the Attendance pilot navigation until released, enabled and authorized.')+btn('Preview this workflow','expand',true,'eye');else if(p==='today')body=today();else if(p==='classes')body=id?classDetail(id):classes();else if(p==='attendance')body=id?attendance(id):history();else if(p==='history')body=history();else if(p==='account'||p==='access')body=account();else if(p==='learning')body=id==='task'?taskDetail(part):id==='review'?reviewWork(part):id==='progress'?progress():learning();else if(p==='assessments')body=id==='gradebook'?gradebook():assessments();else if(p==='communication')body=db.branch==='Whitefield'?communication(id==='thread'):empty('No messages in this branch','Only current permitted branch audiences appear here.');else if(p==='planning')body=planning();else if(p==='journeys')body=journeys();else if(p==='flow')body=wizard(id);else if(p==='drafts')body=drafts();else if(p==='receipt')body=receiptPage(id); function reviewAttendance(){if(!S.register)return;const c=M.counts(S.register.marks);if(c.Unmarked){S.modal={type:'unmarked'};modal('Finish marking the whole roster',`<p style="margin-top:18px">${c.Unmarked} of ${Object.keys(S.register.marks).length} pupils still need a mark. Search and filters do not reduce the submission scope.</p>`,btn('Keep reviewing','close')+btn('Go to next unmarked','next-unmarked',true,'arrow'));return;}const s=M.get(db,S.register.sessionId);S.modal={type:'submit'};modal('Submit this register?',`<p style="margin-top:18px"><strong>${h(s.subject)} · ${h(className(s.classId))}</strong></p><p class="muted small">${h(s.date)} · ${h(s.start)}–${h(s.end)} · ${h(db.branch)}</p><div class="receipt-counts">${M.statuses.map(st=>`<div>${st}<strong>${c[st]}</strong></div>`).join('')}</div><p class="small muted">All ${Object.keys(S.register.marks).length} pupils are marked. After submission, the school administrator handles any correction.</p>`,btn('Back to register','close')+btn('Submit attendance','submit-attendance',true,'check'));}
function submitAttendance(){const d=S.register;if(!d)return;close();if(S.scenario==='save-failure'){S.scenario='normal';S.errors={_:'Attendance was not submitted. Please try again.'};render();return;}if(S.scenario==='conflict'){S.scenario='normal';M.get(db,d.sessionId).version++;}if(!d.key)d.key='ATT-'+d.sessionId+'-'+Date.now();try{const result=M.submit(db,d,d.key);if(S.scenario==='timeout'){S.scenario='normal';d.outcome='unknown';d.dirty=true;render();return;}S.register=null;S.errors={};render();announce('Attendance submitted. Reference '+result.id);toast('Attendance submitted · '+result.id);}catch(e){if(e.message==='CONFLICT'){d.outcome='conflict';d.key=null;S.errors={};}else if(e.message==='DENIED'){resetEdits();S.scenario='denied';}else S.errors={_:'Submission could not be completed: '+({INCOMPLETE:'some pupils are unmarked',REPLAY_CONFLICT:'this request differs from its previous intent',STATE:'the session state changed'}[e.message]||'please review the current session')+'.'};render();}}
function captureMarks(){const form=$('grade-form');if(!form||!S.gradeDraft)return;for(const id of Object.keys(S.gradeDraft)){const state=form.elements.namedItem?form.elements.namedItem('state-'+id):Array.from(form.elements).find(e=>e.name==='state-'+id);const score=form.elements.namedItem?form.elements.namedItem('score-'+id):Array.from(form.elements).find(e=>e.name==='score-'+id);if(state)S.gradeDraft[id].state=state.value;if(score)S.gradeDraft[id].score=S.gradeDraft[id].state==='Scored'?score.value:'';}}

function action(a,el={dataset:{}}){const d=el.dataset||{};if(a==='close')close();else if(a==='menu'){S.menu=!S.menu;render();}else if(a==='normal'){S.scenario='normal';render();}else if(a==='expand'){S.mode='expanded';render();}else if(a==='demo-login'||a==='expired-login'){resetEdits();S.scenario='normal';db.revoked=false;go(a==='demo-login'?'today':'sign-in');render();}else if(a==='signout')navigate('sign-in');else if(a==='branch'){S.modal={type:'branches'};modal('Choose branch',`<div style="padding-top:16px">${['Whitefield','Indiranagar'].map(b=>`<button class="management-link" style="width:100%;border:0;background:none;text-align:left" data-action="choose-branch" data-branch="${b}">${icon('school')}<span><strong>${b}</strong><small style="display:block;color:var(--muted)">${b===db.branch?'Current workspace':'Authorized teacher membership'}</small></span></button>`).join('')}</div>`);}else if(a==='choose-branch'){if(dialog.open)close();switchBranch(d.branch);}else if(a==='confirm-branch'){const target=S.modal.target;close();resetEdits();db=DBS[target];go('today');render();toast('Now viewing '+target+'.');}else if(a==='discard-leave'){const target=S.modal.target;close();resetEdits();if(target.startsWith('flow/')&&flow(target.split('/')[1])?.phase>1)S.mode='expanded';go(target);}else if(a==='open-register'){try{M.open(db,d.id);S.register=M.draft(db,d.id);S.errors={};render();announce('Register opened. All pupils are unmarked.');}catch(e){S.errors={_:'This register cannot be opened.'};modal('Register unavailable',`<p style="margin-top:18px">${h(e.message==='EMPTY_ROSTER'?'No eligible pupils were found. Ask the school administrator to review enrollment before continuing.':'The session or your assignment changed. Return to My Teaching Day and refresh.')}</p>`,btn('Close','close'));}}else if(a==='bulk-present'){const c=M.counts(S.register.marks);S.modal={type:'bulk'};modal('Mark unmarked pupils present?',`<p style="margin-top:18px">Set the remaining <strong>${c.Unmarked} pupils</strong> to Present across the whole roster?</p><p class="muted small" style="margin-top:12px">Existing Absent, Late and Excused marks are kept. Filters do not change this scope.</p>`,btn('Cancel','close')+btn('Mark '+c.Unmarked+' present','confirm-bulk',true,'check'));}else if(a==='confirm-bulk'){M.markRemaining(S.register);close();render();announce('Unmarked pupils set to Present. Existing exceptions preserved.');}else if(a==='review-attendance')reviewAttendance();else if(a==='submit-attendance')submitAttendance();else if(a==='next-unmarked'){if(dialog.open)close();const pid=Object.keys(S.register.marks).find(k=>!S.register.marks[k]);if(!pid)return;S.focusId='mark-'+pid+'-Present';const rr=r();if(rr.q.has('pupil')||rr.q.has('unmarked')){rr.q.delete('pupil');rr.q.delete('unmarked');go(rr.path+'?'+rr.q.toString());}else $(S.focusId)?.focus();}else if(a==='toggle-unmarked')updateQuery(q=>q.get('unmarked')==='1'?q.delete('unmarked'):q.set('unmarked','1'));else if(a==='clear-roster')updateQuery(q=>{q.delete('unmarked');q.delete('pupil');});else if(a==='check-status'){if(dialog.open)close();try{const result=M.receipt(db,S.register.key);if(result){S.register=null;render();toast('Submission confirmed · '+result.id);}else{S.register.outcome='retryable';render();toast('No committed receipt found in this simulation. Only the unchanged intent can be retried.');}}catch{resetEdits();S.scenario='denied';render();}}else if(a==='retry-same')submitAttendance();else if(a==='status-failure'){toast('Status check unavailable. Outcome remains unknown; editing stays paused.');}else if(a==='reload-register'){S.modal={type:'reload'};modal('Reload the current register?',`<p style="margin-top:18px">Discard this unsent draft and read the current authorized session. Review every mark again.</p>`,btn('Keep reviewing','close')+btn('Reload current record','confirm-reload',true));}else if(a==='confirm-reload'){close();S.register=null;S.errors={};render();}else if(a==='correction'){const s=M.get(db,d.id);S.modal={type:'correction'};modal('Ask the school administrator',`<p style="margin-top:18px">Use the school’s approved support channel and quote:</p><div class="card" style="margin-top:14px"><strong>${h(s.subject)} · ${h(className(s.classId))}</strong><p class="small">${h(s.date)} · ${h(s.start)} · ${h(s.receipt)}</p></div><p class="small muted" style="margin-top:16px">The administrator records any correction with a reason. This Phase 1 handoff does not submit a new request or change attendance.</p>`,btn('Close','close')+(S.mode==='expanded'?link('Preview correction request','flow/TEA-16',false,'arrow'):''));}else if(a==='filters')filters(d.scope);else if(a==='sort')sort(d.scope);else if(a==='apply-filters'){const vals=[...$('filter-form').elements].filter(e=>e.checked).map(e=>[e.name,e.value]);close();updateQuery(q=>{q.delete('status');q.delete('class');vals.forEach(([k,v])=>q.append(k,v));});}else if(a==='apply-sort'){const vals=[...$('sort-form').elements].filter(e=>e.checked).map(e=>[e.name,e.value]);close();updateQuery(q=>vals.forEach(([k,v])=>q.set(k,v)));}else if(a==='clear-filters')updateQuery(q=>{q.delete('q');q.delete('status');q.delete('class');});else if(a==='remove-filter')updateQuery(q=>{const vs=q.getAll(d.key).filter(v=>v!==d.value);q.delete(d.key);vs.forEach(v=>q.append(d.key,v));});else if(a==='wizard-back'){capture();S.wizard.index--;S.errors={};render();}else if(a==='wizard-cancel')navigate(flow(S.wizard.id).area);else if(a==='save-draft'){capture();if(!S.wizard?.dirty)return;const safe=M.clone(S.wizard);for(const f of flow(safe.id).steps.flatMap(s=>s.fields))if(f.type==='password')delete safe.data[f.name];safe.dirty=false;db.drafts[safe.id]=safe;S.wizard=null;go('drafts');toast('Task draft saved in this review session. Reloading clears it.');}else if(a==='discard-draft'){S.modal={type:'discard-draft',id:d.id};modal('Discard this draft?',`<p style="margin-top:18px">Discard ${h(flow(d.id).title)}?</p>`,btn('Keep draft','close')+btn('Discard draft','confirm-discard-draft',true));}else if(a==='confirm-discard-draft'){delete db.drafts[S.modal.id];close();render();}else if(a==='save-feedback'){const v=values($('feedback-form')),w=db.submissions.find(w=>w.id===d.id);w.feedback=v.feedback;w.nextStep=v.nextStep;S.feedbackDirty=false;render();toast('Private feedback draft saved in the review.');}else if(a==='review-feedback'){const v=values($('feedback-form'));if(!v.feedback.trim()||!v.nextStep.trim()){$('feedback-error').textContent='Add both a strength and a next step before returning feedback.';return;}S.modal={type:'feedback',id:d.id,values:v};modal('Return this feedback?',`<p style="margin-top:18px">The learner will see this reviewed feedback. Family visibility still needs a permitted purpose and enabled module.</p><div class="section-divider"></div><h3>What worked well</h3><p class="small">${h(v.feedback)}</p><h3 style="margin-top:18px">Next step</h3><p class="small">${h(v.nextStep)}</p>`,btn('Keep editing','close')+btn('Return feedback','confirm-feedback',true));}else if(a==='confirm-feedback'){const w=db.submissions.find(w=>w.id===S.modal.id);Object.assign(w,S.modal.values,{returned:true});S.feedbackDirty=false;close();render();toast('Feedback returned in the fictional review.');}else if(a==='save-marks'){if(saveMarks()){render();toast('Private draft marks saved. Results are not published.');}}else if(a==='review-marks'){captureMarks();S.errors=M.validateMarks(S.gradeDraft,db.assessment.max);if(Object.keys(S.errors).length){render();return;}if(Object.values(S.gradeDraft).some(m=>m.state==='Not entered')){modal('Marks are incomplete',`<p style="margin-top:18px">Every pupil needs an explicit outcome before moderation. “Not entered” does not count as zero.</p>`,btn('Return to marks','close'));return;}S.modal={type:'marks'};modal('Submit marks for moderation?',`<p style="margin-top:18px">Submit this exact draft revision to the authorized moderator? This does not publish results.</p>`,btn('Keep editing','close')+btn('Submit for moderation','confirm-marks',true));}else if(a==='confirm-marks'){if(saveMarks()){db.assessment.status='Awaiting moderation';close();render();toast('Revision submitted for moderation.');}}else if(a==='reset'){S.modal={type:'reset'};modal('Reset the fictional review?',`<p style="margin-top:18px">Only this prototype’s in-memory marks, drafts and simulated outcomes will be cleared. No real system is connected.</p>`,btn('Cancel','close')+btn('Reset review','confirm-reset',true));}else if(a==='confirm-reset')location.reload();}
function submitWorkflow(){capture();const w=S.wizard,f=flow(w.id);if(w.index<f.steps.length){S.errors=M.validate(f.steps[w.index].fields,w.data);if(Object.keys(S.errors).length){render();document.querySelector('[aria-invalid=true]')?.focus();return;}w.index++;S.errors={};render();$('page-title')?.focus();return;}if(S.scenario==='save-failure'){S.scenario='normal';S.errors={_:'The review action was not recorded. Try again.'};render();return;}if(S.scenario==='conflict'){S.scenario='normal';S.errors={_:'The referenced record changed. Review the current context before confirming.'};render();return;}let rc=db.flowReceipts.find(x=>x.key===w.key);if(!rc){rc={id:'TEACH-DEMO-'+String(db.flowReceipts.length+1).padStart(4,'0'),key:w.key,workflow:f.id,area:f.area,branch:db.branch,outcome:f.outcome};db.flowReceipts.push(rc);}delete db.drafts[f.id];S.wizard=null;go('receipt/'+rc.id);}

    function rowById(id){const [date,cl,p]=id.split('|');const r=M.occurrence(db,date,cl,p);if(!r)throw Error('This lesson is no longer available.');const list=M.rows(db,ctx(),M.monday(date),['parent','student'].includes(ctx().role)?ctx().classId:undefined);if(!list.some(x=>x.id===id))throw Error('This lesson is not available in your current scope.');return r;}

    function newChange(){const rows=M.rows(db,ctx(),state.week,state.classId).filter(x=>x.status!=='Cancelled');modal('Choose a lesson',`<form data-tt-form="choose-change">${select('occurrence','Lesson',rows.map(x=>[x.id,`${M.days[M.dayIndex(x.date)]} ${x.start} · ${x.subject}`]),rows[0]?.id)}${select('type','Change',[['Cover','Assign a substitute'],['Move','Move time or room'],['Cancel','Cancel lesson']],'Cover')}${foot('Continue')}</form>`);}
    function changeForm(type){const r=rowById(state.selected);state.changeType=type;state.commandKey=key();state.expected=db.version;let details=type==='Cover'?select('teacher','Substitute teacher',[['','Choose an eligible teacher'],...M.candidates(db,ctx(),r).filter(x=>x.eligible).map(x=>[x.id,x.name])],'','Only eligible teachers without a timetable clash are listed.')+`<ul class="tt-list">${M.candidates(db,ctx(),r).filter(x=>!x.eligible).map(x=>`<li>${x.name}<small>${x.reason}</small></li>`).join('')}</ul>`:type==='Move'?`<div class="tt-grid">${field('start','New start',r.start,'time')}${field('end','New end',r.end,'time')}${select('room','Room',db.rooms.map(x=>[x.id,x.name]),r.room)}</div>`:note('Cancel only this lesson','The weekly pattern stays unchanged. Notify affected users and follow the school’s supervision procedure.','warn');

    function oversight(){const all=M.rows(db,ctx(),state.week,state.classId);const issues=db.changes.filter(x=>all.some(r=>r.id===x.occurrence)&&!x.superseded&&x.date>=state.week&&x.date<M.addDays(state.week,7)&&(['Needs cover'].includes(x.state)||x.ack==='Awaiting acknowledgement'));return controls()+`<div class="tt-counts"><div><strong>${issues.filter(x=>x.state==='Needs cover').length}</strong><small>Classes needing cover</small></div><div><strong>${issues.filter(x=>x.ack==='Awaiting acknowledgement').length}</strong><small>Cover acknowledgements pending</small></div><div><strong>${db.requests.filter(x=>x.state==='Pending'&&all.some(r=>r.id===x.occurrence)).length}</strong><small>Teacher requests awaiting review</small></div></div>`+note('School timetable coordinator owns the next action','This oversight view does not grant timetable editing or attendance marking.')+(issues.length?`<div class="tt-table"><table><caption>Timetable exceptions</caption><thead><tr><th>Lesson</th><th>Exception</th><th>Owner</th><th>View</th></tr></thead><tbody>${issues.map(x=>{const r=all.find(r=>r.id===x.occurrence);return r?`<tr><td>${esc(r.subject)}<br><small>${className(r.classId)} · ${dateLabel(r.date)}</small></td><td data-label="Exception">${badge(x.state==='Needs cover'?'Needs cover':x.ack,'warn')}</td><td data-label="Owner">School timetable coordinator</td><td class="tt-actioncol"><button class="tt-rowaction" data-tt="lesson" data-id="${esc(r.id)}">${icon('eye')}View</button></td></tr>`:'';}).join('')}</tbody></table></div>`:empty('No cover exceptions in this review','Published schedules still remain available for authorized oversight.'))+`<div class="tt-card" style="margin-top:18px"><h2>Published timetable</h2><p>Inspect the current schedule without changing class or attendance records.</p><div style="margin-top:12px">${b('View class timetable','principal-week',false,'calendar')}</div></div>`;}
    function operator(){if(!state.opBranches){state.opBranches=Object.fromEntries((context.branches||[{id:'whitefield',name:'Whitefield',ready:true,status:'Active'}]).map((b,i)=>[b.id,i===0]));state.opBranch=Object.keys(state.opBranches)[0];}const branch=(context.branches||[{id:'whitefield',name:'Whitefield',ready:true,status:'Active'}]).find(b=>b.id===state.opBranch);db.module.enabled=state.opBranches[state.opBranch];return `<header class="tt-head"><div><h1>Timetable module</h1><p>Institution licensing and branch activation. School teams own lesson planning.</p></div></header>${note('Phase 3 configuration preview','These controls use a fictional released catalog entry. They do not change the current product’s release status.','info')}<div class="tt-split"><section class="tt-card"><h2>Institution license</h2>${kv([['Institution',context.institution||'Greenwood Schools'],['Module','Timetable'],['License',db.module.licensed?'Licensed':'Not licensed'],['Attendance','Independent module; unchanged by this license']])}${b(db.module.licensed?'Remove license':'Add license','license',false,'edit',context.readOnly?'disabled':'')}<div class="tt-divider"></div><h2>Branch activation</h2><label class="tt-field" style="margin-top:14px"><span>Branch</span><select data-tt-field="opbranch">${(context.branches||[{id:'whitefield',name:'Whitefield'}]).map(b=>`<option value="${esc(b.id)}" ${b.id===state.opBranch?'selected':''}>${esc(b.name)}</option>`).join('')}</select></label>${kv([['School setup',branch.ready?'Ready':'Not ready'],['Institution & branch',branch.status==='Active'?'Active':'Branch inactive'],['Timetable',db.module.enabled?'Active':'Not active']])}${b(db.module.enabled?'Deactivate branch':'Activate branch','activation',true,'check',context.readOnly?'disabled':'')}</section><aside class="tt-card"><h2>What the school needs</h2><ul class="tt-list"><li>Academic year, calendar and classes</li><li>Eligible teacher assignments</li><li>School timetable management grants</li></ul><div class="tt-divider"></div><p>Licensing never grants access to pupil records or timetable editing. Removing access retains schedules and attendance evidence.</p></aside></div>`;}
    function tools(){if(state.preview)return `<div class="tt-preview-banner"><span><strong>Fictional ${ctx().role} preview</strong> · Uses the same review data. No production role switch.</span>${b(context.role==='admin'?'Back to administrator':'Back to my timetable','end-preview',false,'back')}</div>`;return '';}
    function reviewTools(){return `<details class="tt-reviewtools"><summary>Design review tools</summary><p style="margin-top:10px">Fictional review data is held in this page. Reloading resets it; separate packs do not share live state.</p><div class="tt-actions">${context.role==='admin'?b('Teacher view','preview-teacher',false,'eye')+b('Student view','preview-student',false,'eye')+b('Parent view','preview-parent',false,'eye')+b('Principal view','preview-principal',false,'eye'):''}${['admin','teacher'].includes(context.role)?b('Review as substitute','preview-cover',false,'people'):''}${b('Reset timetable example','reset',false,'back')}${context.role==='admin'?b('Simulate unknown publication','unknown-next',false,'info'):''}</div></details>`;}
    function receipt(){return `<section class="tt-card"><div class="tt-status">${state.unknown?'Confirmation pending':'Saved in this review'}</div><h1 style="margin-top:15px">${state.unknown?'Check the existing publication':state.receipt?.title||'Timetable updated'}</h1><p style="margin-top:12px">${state.unknown?'The acknowledgement did not arrive. Check the original command before trying again.':'The shared schedule has been updated. Notifications are queued separately.'}</p>${kv([['Reference',state.receipt?.reference||state.commandKey],['Scope','Greenwood · Whitefield']])}<div class="tt-actions">${state.unknown?b('Check existing status','check-status',true,'clock'):b('View published timetable','published',true,'calendar')}${!state.unknown&&context.role==='admin'?b('Preview teacher view','preview-teacher',false,'eye'):''}</div></section>`;}
    function render(c){context=c;if(!state.initialized){state.initialized=true;if(c.role==='teacher')state.classId='';}

      return `<section class="tt" aria-label="Timetable workspace">${out}${reviewTools()}<p class="tt-footer">Timetable design review · Fictional school data · Phase 3 proposal · Changes are not saved to a school server.</p></section>`;
    }
    function mount(el,c){host=el;host.innerHTML=render(c);}
    function discardGuard(fn){if(!state.dirty||state.draftSaved){fn();return;}state.pendingLeave=fn;modal('Leave this draft?',`<p>Your changes have not been saved as a draft in this review.</p><div class="tt-formfoot">${b('Keep editing','close')}${b('Discard draft','discard-draft')}${b('Save draft and leave','save-leave',true,'save')}</div>`);}
    function attendanceView(){const id=state.selected,{row,session}=M.attendance(db,ctx(),id);if(!session||session.status==='Scheduled'){

      modal(session.status==='Submitted'?'Submitted attendance':'Mark attendance',`<form data-tt-form="attendance">${note(session.status==='Submitted'?'Read-only receipt':'Assigned lesson roster',teacherName(session.teacher)+' · '+row.subject+' · '+className(row.classId))}${session.marks.map(m=>session.status==='Submitted'?kv([[m.name,m.status]]):select(m.id,m.name,[['','Choose status'],...['Present','Absent','Late','Excused'].map(x=>[x,x])],m.status)).join('<div style="height:12px"></div>')}${session.status==='Submitted'?foot('Close','close'):foot('Submit attendance')}</form>`);
    }
    function action(a,t){state.error='';const c=ctx();
      if(a==='close'){close();return;}
      if(a==='mobile-day'){state.mobileDay=Number(t.dataset.value);rerender();return;}
      if(a==='tab'){discardGuard(()=>{state.tab=t.dataset.value;state.page='';state.draft=false;rerender();});return;}
      if(a==='draft'){M.draft(db,c);state.draft=true;state.page='';state.tab='week';state.week=M.monday(db.draft.from);state.classId=state.classId||'c1';rerender();}
      else if(a==='save-draft'){state.draftSaved=true;state.dirty=false;rerender();toast('Draft saved in this review. Published timetable unchanged.');}
      else if(a==='save-leave'){state.draftSaved=true;state.dirty=false;close();state.pendingLeave?.();}
      else if(a==='discard-draft'){db.draft=null;state.draft=false;state.dirty=false;close();state.pendingLeave?.();}
      else if(a==='published'){discardGuard(()=>{state.draft=false;state.page='';state.tab='week';rerender();});}
      else if(a==='changes'){state.draft=false;state.tab='changes';rerender();}
      else if(a==='prev'||a==='next'){state.week=M.addDays(state.week,a==='prev'?-7:7);rerender();}
      else if(a==='add-slot')editSlot(null,t.dataset.day,t.dataset.period);
      else if(a==='edit-slot')editSlot(t.dataset.id);
      else if(a==='remove-slot'){db.draft.slots=db.draft.slots.filter(s=>s.id!==t.dataset.id);state.dirty=true;state.draftSaved=false;close();rerender();}
      else if(a==='schoolday')schoolday();
      else if(a==='review')review();
      else if(a==='back-draft'){state.page='';state.draft=true;rerender();}

      else if(a.startsWith('change-'))changeForm({ 'change-cover':'Cover','change-move':'Move','change-cancel':'Cancel'}[a]);
      else if(a==='cover-yes'||a==='cover-no'){M.respondCover(db,c,t.dataset.id,a==='cover-yes');close();rerender();toast(a==='cover-yes'?'Cover acknowledged.':'Coordinator informed: the lesson needs cover.');}
      else if(a==='request')modal('Request a schedule change',`<form data-tt-form="request">${field('message','What does the coordinator need to know?','','textarea','Keep private staff information out of the handover.')}<p class="tt-muted" style="margin-top:12px">Your request does not change the published schedule.</p>${foot('Send request')}</form>`);
      else if(a==='review-request'){const r=db.requests.find(x=>x.id===t.dataset.id);state.requestId=r.id;state.selected=r.occurrence;modal('Review teacher request',kv([['Teacher',teacherName(r.teacher)],['Request',r.message]])+`<div class="tt-actions">${b('Arrange cover','change-cover',true,'people')}${b('Return with a note','return-request',false,'back')}</div>`);}
      else if(a==='return-request')modal('Return request',`<form data-tt-form="return-request">${field('note','Note to teacher','','textarea')}${foot('Return request')}</form>`);
      else if(a==='attendance')attendanceView();
      else if(a==='clock-to-lesson'){const r=rowById(state.selected);db.now=r.date+'T'+r.start+':00+05:30';toast('Fictional review clock advanced.');}
      else if(a==='open-roster'){M.attendance(db,c,state.selected,true);attendanceView();}
      else if(a==='principal-week'){state.page='principal-week';state.tab='week';rerender();}
      else if(a==='filters'){modal('Filters',`<form data-tt-form="filters"><details class="tt-drawer-group" open><summary>Change type ${icon('down')}</summary>${['Cover','Move','Cancel'].map(v=>`<label><input type="checkbox" name="types" value="${v}" ${state.filters.includes(v)?'checked':''}>${v}</label>`).join('')}</details>${foot('Apply')}</form>`,true);}
      else if(a==='sort'){modal('Sort',`<form data-tt-form="sort"><details class="tt-drawer-group" open><summary>Sort by ${icon('down')}</summary>${[['date','Lesson date'],['type','Change type']].map(([v,l])=>`<label><input type="radio" name="by" value="${v}" ${state.sortBy===v?'checked':''}>${l}</label>`).join('')}</details><details class="tt-drawer-group" open><summary>Order by ${icon('down')}</summary>${[['asc','Ascending'],['desc','Descending']].map(([v,l])=>`<label><input type="radio" name="order" value="${v}" ${state.order===v?'checked':''}>${l}</label>`).join('')}</details>${foot('Apply')}</form>`,true);}
      else if(a==='remove-filter'){state.filters=state.filters.filter(x=>x!==t.dataset.value);rerender();}
      else if(a.startsWith('preview-')){discardGuard(()=>{const role=a.replace('preview-','');state.preview={role:role==='cover'?'teacher':role,teacher:role==='cover'?'rohan':'ananya',classId:'c1',timetablePurpose:true,childName:'Aarav Mehta'};state.page='';state.tab='week';state.draft=false;close();rerender();});}
      else if(a==='end-preview'){state.preview=null;state.page='';state.tab='week';rerender();}
      else if(a==='reset'){db=M.seed();Object.assign(state,{page:'',tab:'week',preview:null,draft:false,dirty:false,draftSaved:false,unknown:null,receipt:null,error:''});close();rerender();toast('Timetable example reset. Other module data is unchanged.');}
      else if(a==='unknown-next'){state.failNext=true;toast('The next publication will simulate a lost acknowledgement.');}
      else if(a==='check-status'){const r=db.receipts.find(x=>x.key===state.commandKey);if(!r)throw Error('No final result is available yet. Keep this command reference.');state.unknown=null;state.receipt={...r.result,title:'Timetable published'};rerender();}
      else if(a==='license'||a==='activation'){if(context.role!=='operator'||context.readOnly)throw Error('Module configuration permission is required.');state.configAction=a;modal(a==='license'?'Change timetable license':'Change branch activation',`<form data-tt-form="config">${note('Review the impact',a==='license'?'Removing the license disables timetable access. Adding it does not activate the branch.':'This changes Timetable only for the selected branch. Attendance licensing and records remain separate.','warn')}${field('reason','Reason','','textarea')}${a==='license'?field('approval','Agreement / approval reference'):''}<label class="tt-check"><input name="confirm" type="checkbox" required>I have reviewed this configuration change.</label>${foot('Confirm change')}</form>`);}

    function submit(form){const fd=new FormData(form),v=Object.fromEntries(fd),type=form.dataset.ttForm,c=ctx();
      if(type==='slot'){M.putSlot(db,c,{id:state.editId,classId:state.classId,day:Number(v.day),periodId:v.periodId,subject:v.subject,teacher:v.teacher,room:v.room});state.dirty=true;state.draftSaved=false;close();rerender();}

      else if(type==='change'){if(!v.confirm)throw Error('Confirm that you reviewed this change.');const r=rowById(state.selected),payload={date:r.date,classId:r.classId,periodId:r.periodId,type:state.changeType,reason:v.reason,...(state.changeType==='Cover'?{teacher:v.teacher}:state.changeType==='Move'?{start:v.start,end:v.end,room:v.room}:{})};const res=M.change(db,c,state.commandKey,state.expected,payload);if(state.requestId){const req=db.requests.find(x=>x.id===state.requestId);if(req?.occurrence===r.id)req.state='Resolved by '+res.reference;state.requestId=null;}close();state.tab='changes';rerender();toast('Dated change saved. The weekly pattern is unchanged.');}

      else if(type==='attendance'){M.submitAttendance(db,c,state.selected,v);attendanceView();toast('Attendance submitted in this review.');}
      else if(type==='search'){state.search=v.search.trim();state.attribute=v.attribute;rerender();}
      else if(type==='filters'){state.filters=fd.getAll('types');close();rerender();}
      else if(type==='sort'){state.sortBy=v.by;state.order=v.order;close();rerender();}
      else if(type==='config'){if(context.role!=='operator'||context.readOnly||!v.reason.trim()||!v.confirm)throw Error('Authorized confirmation and a reason are required.');if(state.configAction==='license'){if(!v.approval.trim())throw Error('Add an agreement reference.');db.module.licensed=!db.module.licensed;if(!db.module.licensed){db.module.enabled=false;Object.keys(state.opBranches).forEach(k=>state.opBranches[k]=false);}}else{if(!db.module.licensed||!db.module.released)throw Error('License and release prerequisites must be met first.');const branch=context.branches?.find(b=>b.id===state.opBranch);if(!db.module.enabled&&branch&&(!branch.ready||branch.status!=='Active'))throw Error('The selected branch must be active and setup-ready.');db.module.enabled=!db.module.enabled;state.opBranches[state.opBranch]=db.module.enabled;}db.audit.push({kind:'Timetable configuration changed',reason:v.reason});close();rerender();toast('Fictional timetable configuration updated.');}
    }
    document.addEventListener('click',e=>{const t=e.target.closest('[data-tt]');if(t){e.preventDefault();e.stopImmediatePropagation();guarded(()=>action(t.dataset.tt,t));return;}const link=e.target.closest('a[href]');if(link&&state.dirty&&!state.draftSaved&&host?.isConnected){e.preventDefault();e.stopImmediatePropagation();discardGuard(()=>{location.href=link.href;});}},true);
    document.addEventListener('submit',e=>{if(!e.target.matches('[data-tt-form]'))return;e.preventDefault();e.stopImmediatePropagation();guarded(()=>submit(e.target));},true);
    document.addEventListener('change',e=>{const t=e.target;if(!t.dataset.ttField)return;e.stopImmediatePropagation();guarded(()=>{if(t.dataset.ttField==='opbranch')state.opBranch=t.value;if(t.dataset.ttField==='class')state.classId=t.value;if(t.dataset.ttField==='week'){if(!t.value)throw Error('Choose a valid week.');state.week=M.monday(t.value);}rerender();});},true);
    window.addEventListener('beforeunload',e=>{if(state.dirty&&!state.draftSaved){e.preventDefault();e.returnValue='';}});
    return {render,mount,state,get db(){return db;},get context(){return context;},action,lesson,close,model:M};
  }
  return {create,icon};
})();
