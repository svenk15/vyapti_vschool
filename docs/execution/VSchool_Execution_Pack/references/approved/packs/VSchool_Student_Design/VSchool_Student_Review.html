function routePage(){
 const [area,id,extra]=S.route.split('/');
 if(S.state==='loading')return pageHead('Loading your workspace','Checking your current school context…')+card('', '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>');
 if(S.state==='load-error')return pageHead('We could not load this view','Your saved school records have not changed.')+card('',btn('Try again','retry-load','',true,'refresh'));
 if(S.state==='denied')return unavailable('This item is no longer available for your account.');
 switch(area){
 case 'home':return home();
 case 'assignments':return assignments();
 case 'assignment':return assignmentPage(id);
 case 'work':return workPage(id);
 case 'submission':return submission(id);

 case 'feedback':return feedbackPage(id);

 case 'calendar':return calendarPage();

 }

function render(focus=true){
 let content;
 if(S.state==='expired'){D.signedIn=false;S.editors={};S.dirtyFlow=false;S.flowValues={};}
 if(!D.signedIn){if(S.route.startsWith('flow/')&&['STW-01','STW-02','STW-03'].includes(S.route.split('/')[1]))content='<main class="content" id="main">'+flowPage(S.route.split('/')[1])+'</main>';else content=signIn();}
 else{
 try{content=shell(routePage());}
 catch(e){if(e.message==='PHASE_PREVIEW')content=shell(phasePage());else{S.error=errors[e.message]||'This item is not available in your current workspace.';try{content=shell(unavailable(S.error));}catch{content='<main class="content" id="main">'+unavailable(S.error)+'</main>';}}}
 }
 $('#app').innerHTML=content;if(focus){$('#page-title')?.focus({preventScroll:true});window.scrollTo(0,0);}
 $('#review-scope').value=S.scope;
}

async function action(name,el){
 const id=el?.dataset.id;
 switch(name){
 case 'close-dialog':closeDialog();break;
 case 'filters':openFilters();break;
 case 'sort':openSort();break;
 case 'apply-filters':S.filters=M.clone(S.filterDraft);closeDialog();render(false);tell('Filters applied');break;
 case 'apply-sort':S.sort={...S.sortDraft};closeDialog();render(false);tell('Sort applied');break;
 case 'remove-filter':S.filters[el.dataset.kind]=S.filters[el.dataset.kind].filter(x=>x!==el.dataset.value);render(false);break;
 case 'clear-filters':S.search='';S.filters={subject:[],status:[]};render(false);break;
 case 'contexts':openContexts();break;
 case 'switch-context':

  function authorize(db,ctx,write=false){

    for(let i=0;i<p.slots.length;i++)for(let j=i+1;j<p.slots.length;j++){
      const a=p.slots[i],b=p.slots[j],pa=p.periods.find(x=>x.id===a.periodId),pb=p.periods.find(x=>x.id===b.periodId);

    function changes(){const c=ctx(),admin=c.role==='admin',all=M.rows(db,c,state.week,c.role==='teacher'?'':state.classId);let changes=db.changes.filter(x=>all.some(r=>r.id===x.occurrence));if(state.search)changes=changes.filter(x=>{const r=all.find(r=>r.id===x.occurrence);return String(state.attribute==='subject'?r?.subject:x.id).toLowerCase().includes(state.search.toLowerCase());});if(state.filters.length)changes=changes.filter(x=>state.filters.includes(x.type));changes.sort((a,b)=>String(state.sortBy==='date'?a.date:a.type).localeCompare(String(state.sortBy==='date'?b.date:b.type))*(state.order==='asc'?1:-1));

      if(c.role==='teacher'){const mine=db.requests.filter(r=>r.teacher===c.teacher);out+=`<section class="tt-card" style="margin-top:20px"><h2>My change requests</h2>${mine.length?`<ul class="tt-list">${mine.map(r=>`<li>${esc(r.message)}<small>${esc(r.state)}${r.response?' · '+esc(r.response):''}</small></li>`).join('')}</ul>`:'<p>You have no schedule requests in this review.</p>'}</section>`;}
      out+=`<section class="tt-card" style="margin-top:20px"><h2>Schedule notices</h2><p>${admin?'A published change queues one notice. Delivery does not prove that a person read it.':'Your timetable shows the latest schedule even when an email has not arrived.'}</p>${db.notices.length?`<ul class="tt-list">${db.notices.filter(n=>!n.occurrence||all.some(r=>r.id===n.occurrence)).map(n=>`<li>${esc(n.title)} <small>${dateLabel(n.date)}${admin?' · '+n.state:' · Published schedule update'}</small></li>`).join('')}</ul>`:'<p class="tt-muted">No schedule notices in this review yet.</p>'}</section>`;return out;
    }
    function newChange(){const rows=M.rows(db,ctx(),state.week,state.classId).filter(x=>x.status!=='Cancelled');modal('Choose a lesson',`<form data-tt-form="choose-change">${select('occurrence','Lesson',rows.map(x=>[x.id,`${M.days[M.dayIndex(x.date)]} ${x.start} · ${x.subject}`]),rows[0]?.id)}${select('type','Change',[['Cover','Assign a substitute'],['Move','Move time or room'],['Cancel','Cancel lesson']],'Cover')}${foot('Continue')}</form>`);}
    function changeForm(type){const r=rowById(state.selected);state.changeType=type;state.commandKey=key();state.expected=db.version;let details=type==='Cover'?select('teacher','Substitute teacher',[['','Choose an eligible teacher'],...M.candidates(db,ctx(),r).filter(x=>x.eligible).map(x=>[x.id,x.name])],'','Only eligible teachers without a timetable clash are listed.')+`<ul class="tt-list">${M.candidates(db,ctx(),r).filter(x=>!x.eligible).map(x=>`<li>${x.name}<small>${x.reason}</small></li>`).join('')}</ul>`:type==='Move'?`<div class="tt-grid">${field('start','New start',r.start,'time')}${field('end','New end',r.end,'time')}${select('room','Room',db.rooms.map(x=>[x.id,x.name]),r.room)}</div>`:note('Cancel only this lesson','The weekly pattern stays unchanged. Notify affected users and follow the school’s supervision procedure.','warn');

    function oversight(){const all=M.rows(db,ctx(),state.week,state.classId);const issues=db.changes.filter(x=>all.some(r=>r.id===x.occurrence)&&!x.superseded&&x.date>=state.week&&x.date<M.addDays(state.week,7)&&(['Needs cover'].includes(x.state)||x.ack==='Awaiting acknowledgement'));return controls()+`<div class="tt-counts"><div><strong>${issues.filter(x=>x.state==='Needs cover').length}</strong><small>Classes needing cover</small></div><div><strong>${issues.filter(x=>x.ack==='Awaiting acknowledgement').length}</strong><small>Cover acknowledgements pending</small></div><div><strong>${db.requests.filter(x=>x.state==='Pending'&&all.some(r=>r.id===x.occurrence)).length}</strong><small>Teacher requests awaiting review</small></div></div>`+note('School timetable coordinator owns the next action','This oversight view does not grant timetable editing or attendance marking.')+(issues.length?`<div class="tt-table"><table><caption>Timetable exceptions</caption><thead><tr><th>Lesson</th><th>Exception</th><th>Owner</th><th>View</th></tr></thead><tbody>${issues.map(x=>{const r=all.find(r=>r.id===x.occurrence);return r?`<tr><td>${esc(r.subject)}<br><small>${className(r.classId)} · ${dateLabel(r.date)}</small></td><td data-label="Exception">${badge(x.state==='Needs cover'?'Needs cover':x.ack,'warn')}</td><td data-label="Owner">School timetable coordinator</td><td class="tt-actioncol"><button class="tt-rowaction" data-tt="lesson" data-id="${esc(r.id)}">${icon('eye')}View</button></td></tr>`:'';}).join('')}</tbody></table></div>`:empty('No cover exceptions in this review','Published schedules still remain available for authorized oversight.'))+`<div class="tt-card" style="margin-top:18px"><h2>Published timetable</h2><p>Inspect the current schedule without changing class or attendance records.</p><div style="margin-top:12px">${b('View class timetable','principal-week',false,'calendar')}</div></div>`;}
    function operator(){if(!state.opBranches){state.opBranches=Object.fromEntries((context.branches||[{id:'whitefield',name:'Whitefield',ready:true,status:'Active'}]).map((b,i)=>[b.id,i===0]));state.opBranch=Object.keys(state.opBranches)[0];}const branch=(context.branches||[{id:'whitefield',name:'Whitefield',ready:true,status:'Active'}]).find(b=>b.id===state.opBranch);db.module.enabled=state.opBranches[state.opBranch];return `<header class="tt-head"><div><h1>Timetable module</h1><p>Institution licensing and branch activation. School teams own lesson planning.</p></div></header>${note('Phase 3 configuration preview','These controls use a fictional released catalog entry. They do not change the current product’s release status.','info')}<div class="tt-split"><section class="tt-card"><h2>Institution license</h2>${kv([['Institution',context.institution||'Greenwood Schools'],['Module','Timetable'],['License',db.module.licensed?'Licensed':'Not licensed'],['Attendance','Independent module; unchanged by this license']])}${b(db.module.licensed?'Remove license':'Add license','license',false,'edit',context.readOnly?'disabled':'')}<div class="tt-divider"></div><h2>Branch activation</h2><label class="tt-field" style="margin-top:14px"><span>Branch</span><select data-tt-field="opbranch">${(context.branches||[{id:'whitefield',name:'Whitefield'}]).map(b=>`<option value="${esc(b.id)}" ${b.id===state.opBranch?'selected':''}>${esc(b.name)}</option>`).join('')}</select></label>${kv([['School setup',branch.ready?'Ready':'Not ready'],['Institution & branch',branch.status==='Active'?'Active':'Branch inactive'],['Timetable',db.module.enabled?'Active':'Not active']])}${b(db.module.enabled?'Deactivate branch':'Activate branch','activation',true,'check',context.readOnly?'disabled':'')}</section><aside class="tt-card"><h2>What the school needs</h2><ul class="tt-list"><li>Academic year, calendar and classes</li><li>Eligible teacher assignments</li><li>School timetable management grants</li></ul><div class="tt-divider"></div><p>Licensing never grants access to pupil records or timetable editing. Removing access retains schedules and attendance evidence.</p></aside></div>`;}
    function tools(){if(state.preview)return `<div class="tt-preview-banner"><span><strong>Fictional ${ctx().role} preview</strong> · Uses the same review data. No production role switch.</span>${b(context.role==='admin'?'Back to administrator':'Back to my timetable','end-preview',false,'back')}</div>`;return '';}
    function reviewTools(){return `<details class="tt-reviewtools"><summary>Design review tools</summary><p style="margin-top:10px">Fictional review data is held in this page. Reloading resets it; separate packs do not share live state.</p><div class="tt-actions">${context.role==='admin'?b('Teacher view','preview-teacher',false,'eye')+b('Student view','preview-student',false,'eye')+b('Parent view','preview-parent',false,'eye')+b('Principal view','preview-principal',false,'eye'):''}${['admin','teacher'].includes(context.role)?b('Review as substitute','preview-cover',false,'people'):''}${b('Reset timetable example','reset',false,'back')}${context.role==='admin'?b('Simulate unknown publication','unknown-next',false,'info'):''}</div></details>`;}

    function render(c){context=c;if(!state.initialized){state.initialized=true;if(c.role==='teacher')state.classId='';}

    function action(a,t){state.error='';const c=ctx();

      else if(a==='save-leave'){state.draftSaved=true;state.dirty=false;close();state.pendingLeave?.();}
      else if(a==='discard-draft'){db.draft=null;state.draft=false;state.dirty=false;close();state.pendingLeave?.();}

      else if(a==='principal-week'){state.page='principal-week';state.tab='week';rerender();}
      else if(a==='filters'){modal('Filters',`<form data-tt-form="filters"><details class="tt-drawer-group" open><summary>Change type ${icon('down')}</summary>${['Cover','Move','Cancel'].map(v=>`<label><input type="checkbox" name="types" value="${v}" ${state.filters.includes(v)?'checked':''}>${v}</label>`).join('')}</details>${foot('Apply')}</form>`,true);}
      else if(a==='sort'){modal('Sort',`<form data-tt-form="sort"><details class="tt-drawer-group" open><summary>Sort by ${icon('down')}</summary>${[['date','Lesson date'],['type','Change type']].map(([v,l])=>`<label><input type="radio" name="by" value="${v}" ${state.sortBy===v?'checked':''}>${l}</label>`).join('')}</details><details class="tt-drawer-group" open><summary>Order by ${icon('down')}</summary>${[['asc','Ascending'],['desc','Descending']].map(([v,l])=>`<label><input type="radio" name="order" value="${v}" ${state.order===v?'checked':''}>${l}</label>`).join('')}</details>${foot('Apply')}</form>`,true);}
      else if(a==='remove-filter'){state.filters=state.filters.filter(x=>x!==t.dataset.value);rerender();}
      else if(a.startsWith('preview-')){discardGuard(()=>{const role=a.replace('preview-','');state.preview={role:role==='cover'?'teacher':role,teacher:role==='cover'?'rohan':'ananya',classId:'c1',timetablePurpose:true,childName:'Aarav Mehta'};state.page='';state.tab='week';state.draft=false;close();rerender();});}
      else if(a==='end-preview'){state.preview=null;state.page='';state.tab='week';rerender();}

      else if(a==='unknown-next'){state.failNext=true;toast('The next publication will simulate a lost acknowledgement.');}
      else if(a==='check-status'){const r=db.receipts.find(x=>x.key===state.commandKey);if(!r)throw Error('No final result is available yet. Keep this command reference.');state.unknown=null;state.receipt={...r.result,title:'Timetable published'};rerender();}
      else if(a==='license'||a==='activation'){if(context.role!=='operator'||context.readOnly)throw Error('Module configuration permission is required.');state.configAction=a;modal(a==='license'?'Change timetable license':'Change branch activation',`<form data-tt-form="config">${note('Review the impact',a==='license'?'Removing the license disables timetable access. Adding it does not activate the branch.':'This changes Timetable only for the selected branch. Attendance licensing and records remain separate.','warn')}${field('reason','Reason','','textarea')}${a==='license'?field('approval','Agreement / approval reference'):''}<label class="tt-check"><input name="confirm" type="checkbox" required>I have reviewed this configuration change.</label>${foot('Confirm change')}</form>`);}
    }
    function submit(form){const fd=new FormData(form),v=Object.fromEntries(fd),type=form.dataset.ttForm,c=ctx();
      if(type==='slot'){M.putSlot(db,c,{id:state.editId,classId:state.classId,day:Number(v.day),periodId:v.periodId,subject:v.subject,teacher:v.teacher,room:v.room});state.dirty=true;state.draftSaved=false;close();rerender();}
      else if(type==='schoolday'){const d=M.copy(db.draft);d.from=v.from;d.days=fd.getAll('days').map(Number);d.periods.forEach(p=>{p.start=v[p.id+'-start'];p.end=v[p.id+'-end'];});const errors=M.validate(db,d);if(errors.length)throw Error(errors.join(' '));db.draft=d;state.week=M.monday(d.from);state.dirty=true;state.draftSaved=false;close();rerender();}
      else if(type==='publish'){if(!v.confirm)throw Error('Confirm that you reviewed the impact.');const from=db.draft.from;const result=M.publish(db,c,state.commandKey,state.expected);state.receipt={...result,title:'Timetable published'};state.page='receipt';state.dirty=false;state.draft=false;state.week=M.monday(from);if(state.failNext){state.unknown=true;state.failNext=false;}rerender();}
      else if(type==='restore'){M.restore(db,c,state.selected,v.reason);close();rerender();toast('Published lesson restored; change history retained.');}
      else if(type==='choose-change'){state.selected=v.occurrence;changeForm(v.type);}
      else if(type==='change'){if(!v.confirm)throw Error('Confirm that you reviewed this change.');const r=rowById(state.selected),payload={date:r.date,classId:r.classId,periodId:r.periodId,type:state.changeType,reason:v.reason,...(state.changeType==='Cover'?{teacher:v.teacher}:state.changeType==='Move'?{start:v.start,end:v.end,room:v.room}:{})};const res=M.change(db,c,state.commandKey,state.expected,payload);if(state.requestId){const req=db.requests.find(x=>x.id===state.requestId);if(req?.occurrence===r.id)req.state='Resolved by '+res.reference;state.requestId=null;}close();state.tab='changes';rerender();toast('Dated change saved. The weekly pattern is unchanged.');}
      else if(type==='request'){M.request(db,c,rowById(state.selected),v.message);close();rerender();toast('Request sent to the school timetable coordinator.');}
      else if(type==='return-request'){M.authorize(db,c,true);const req=db.requests.find(x=>x.id===state.requestId);if(!v.note.trim())throw Error('Add a note.');req.state='Returned';req.response=v.note;close();rerender();toast('Request returned with a note.');}
      else if(type==='attendance'){M.submitAttendance(db,c,state.selected,v);attendanceView();toast('Attendance submitted in this review.');}
      else if(type==='search'){state.search=v.search.trim();state.attribute=v.attribute;rerender();}
      else if(type==='filters'){state.filters=fd.getAll('types');close();rerender();}
      else if(type==='sort'){state.sortBy=v.by;state.order=v.order;close();rerender();}
      else if(type==='config'){if(context.role!=='operator'||context.readOnly||!v.reason.trim()||!v.confirm)throw Error('Authorized confirmation and a reason are required.');if(state.configAction==='license'){if(!v.approval.trim())throw Error('Add an agreement reference.');db.module.licensed=!db.module.licensed;if(!db.module.licensed){db.module.enabled=false;Object.keys(state.opBranches).forEach(k=>state.opBranches[k]=false);}}else{if(!db.module.licensed||!db.module.released)throw Error('License and release prerequisites must be met first.');const branch=context.branches?.find(b=>b.id===state.opBranch);if(!db.module.enabled&&branch&&(!branch.ready||branch.status!=='Active'))throw Error('The selected branch must be active and setup-ready.');db.module.enabled=!db.module.enabled;state.opBranches[state.opBranch]=db.module.enabled;}db.audit.push({kind:'Timetable configuration changed',reason:v.reason});close();rerender();toast('Fictional timetable configuration updated.');}
    }
    document.addEventListener('click',e=>{const t=e.target.closest('[data-tt]');if(t){e.preventDefault();e.stopImmediatePropagation();guarded(()=>action(t.dataset.tt,t));return;}const link=e.target.closest('a[href]');if(link&&state.dirty&&!state.draftSaved&&host?.isConnected){e.preventDefault();e.stopImmediatePropagation();discardGuard(()=>{location.href=link.href;});}},true);
    document.addEventListener('submit',e=>{if(!e.target.matches('[data-tt-form]'))return;e.preventDefault();e.stopImmediatePropagation();guarded(()=>submit(e.target));},true);
    document.addEventListener('change',e=>{const t=e.target;if(!t.dataset.ttField)return;e.stopImmediatePropagation();guarded(()=>{if(t.dataset.ttField==='opbranch')state.opBranch=t.value;if(t.dataset.ttField==='class')state.classId=t.value;if(t.dataset.ttField==='week'){if(!t.value)throw Error('Choose a valid week.');state.week=M.monday(t.value);}rerender();});},true);
    window.addEventListener('beforeunload',e=>{if(state.dirty&&!state.draftSaved){e.preventDefault();e.returnValue='';}});
    return {render,mount,state,get db(){return db;},get context(){return context;},action,lesson,close,model:M};
  }
  return {create,icon};
})();
