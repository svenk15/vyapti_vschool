function help(){return heading(state.role==='parent'?'Contact the school':'Family access help',state.role==='parent'?'Ask the school to review access. A request does not automatically add a child.':'A simple route from school verification to parent access.')+(state.role==='admin'?'<section class="card"><h2>Connect a family in four steps</h2><ol><li>Select the student and the adult the school has verified.</li><li>Record the verification reference, access dates and allowed purpose.</li><li>Approve the connection, then send the invitation.</li><li>The intended parent accepts and sees their child’s attendance.</li></ol><p>To review the parent side, use Preview parent handoff below. For this example, connect Diya Rao to Priya Rao using priya@demo.vschool.test. Open the approved connection and choose Preview parent handoff.</p><div class="guard-info">No email, document upload, password change or real authentication is performed by this prototype.</div>'+button('Connect a family','new','',true)+'</section>':'<section class="card wide-field"><h2>Ask about family access</h2><p class="school-note">Do not include identity documents, passwords or private family details.</p><form id="help-form" novalidate><div class="form-field"><label for="request-kind">What do you need help with?</label><select id="request-kind"><option value="">Choose an issue</option><option>My child is missing</option><option>Invitation has not arrived</option><option>My access looks incorrect</option></select></div><div class="form-field" style="margin-top:18px"><label for="request-ref">School-issued reference <span class="optional">(optional)</span></label><input id="request-ref" maxlength="60" autocomplete="off"></div><p id="request-error" class="field-error" role="alert"></p><div class="action-row" style="margin-top:20px">'+button('Send request','request','',true)+'</div></form></section>');}

appropriate.</p>',button('Close','close')+button('Start verification','request-start','data-id="'+id+'"',true));}if(a==='request-start'&&state.role==='admin'){const r=state.requests.find(x=>x.id===id);if(r)r.status='In school review';close();state.draft=emptyDraft();state.step=0;navigate('wizard');}if(a==='request'){const kind=$('#request-kind').value;if(!kind){$('#request-error').textContent='Choose the issue you want the school to review.';return;}const prior=state.requests.find(x=>x.email===state.parentIdentity&&x.kind===kind);if(!prior)state.requests.push({email:state.parentIdentity,kind,reference:$('#request-ref').value.trim().slice(0,60),id:'HELP-'+(state.requests.length+1)});$('#family-view').innerHTML=decorate(receipt('Request received','The school will review your request through its approved process. This does not confirm a student record or add child access.',button('Back to my children','nav','data-route="children"',true)));$('#family-view h1')?.focus();}if(a==='signout'){state.draft=emptyDraft();state.savedDraft=null;navigate('signedout');}

  state.drafts.push({id:'DRAFT-1',...draft(),title:'Mathematics practice this week',body:'Please encourage your child to complete the fractions practice shared in class. We will review the work together on Friday.',audience:'class',className:'Grade 6 · A',ack:false,email:false,status:'Awaiting approval',owner:'teacher',author:'Ananya Rao',version:1});
 }}state=stores.get(database);}

 function go(view,id){state.message=null;state.view=view;state.selected=id||null;state.entry=null;const prior=location.hash;host.go('communication/'+view+(id?'/'+encodeURIComponent(id):''));if(prior===location.hash)host.render();}

 function start(source=null){state.wizard={data:source?{...source,reviewed:false}:{...draft()},step:0,errors:{},id:source?.id||null,expected:source?.version||null,teacher:state.actor==='teacher',fingerprint:null};if(state.actor==='teacher'){state.wizard.data.audience='class';state.wizard.data.className='Grade 6 · A';}state.wizard.original=JSON.stringify(state.wizard.data);go('compose');}
 function field(name,label,type='text',extra=''){const w=state.wizard,e=w.errors[name],d=w.data;return `<div class="field"><label for="c-${name}">${label}</label><input id="c-${name}" name="${name}" type="${type}" value="${h(d[name])}" ${extra} ${e?`aria-invalid="true" aria-describedby="ce-${name}"`:''}>${e?`<p class="error" id="ce-${name}">${h(e)}</p>`:''}</div>`;}
 function validate(step=state.wizard.step){capture();const w=state.wizard,d=w.data,e={};if(step===0||step===2){if(!d.title.trim()||d.title.length>120)e.title='Enter a subject of 1–120 characters.';if(!d.body.trim()||d.body.length>5000)e.body='Enter a message of 1–5,000 characters.';if(d.ack&&(!/^\d{4}-\d{2}-\d{2}$/.test(d.due)||d.due<state.now.slice(0,10)))e.due='Choose today or a later acknowledgement date.';}if(step===1||step===2){if(!['school','class','staff'].includes(d.audience))e.audience='Choose who needs this notice.';if(d.audience==='class'&&!host.database().students.some(s=>s.class===d.className))e.className='Choose a class in this branch.';if(!resolve(d).rows.length)e.audience='No eligible recipients. Review verified family permissions or choose another audience.';}if(step===2){if(d.when==='later'&&(!d.scheduled||d.scheduled<=state.now))e.scheduled='Choose a future date and time in the school’s time zone.';if(d.ack&&d.when==='later'&&d.due<d.scheduled.slice(0,10))e.due='The acknowledgement date must be on or after publication.';if(!d.reviewed)e.reviewed='Confirm that you have reviewed the message and audience.';}w.errors=e;return !Object.keys(e).length;}
 function wizard(){const w=state.wizard;if(!w)return empty('Start a notice','Write a clear message for the right school audience.',button('Create notice','new','',true));const d=w.data,a=resolve(d),cls=[...new Set(host.database().students.map(s=>s.class))];let body='';
 if(w.step===0)body=`${field('title','Subject','text','maxlength="120"')}<div class="field wide"><label for="c-body">Message</label><textarea id="c-body" name="body" rows="7" maxlength="5000" ${w.errors.body?'aria-invalid="true"':''}>${h(d.body)}</textarea>${w.errors.body?`<p class="error">${h(w.errors.body)}</p>`:''}<p class="hint">Use a clear action and date. Keep private student or family details out of a group notice.</p></div><label class="check"><input type="checkbox" name="ack" ${d.ack?'checked':''}>Ask recipients to acknowledge</label><div id="ack-date" ${!d.ack?'hidden':''}>${field('due','Acknowledge by','date')}</div><p class="hint">Acknowledgement confirms receipt of this version. It is not payment approval, consent or permission.</p>`;

 if(w.step===2)body=`<div class="comm-message-preview"><small>Message preview</small><h2>${h(d.title)}</h2><p>${h(d.body)}</p></div><dl class="kv"><dt>Audience</dt><dd>${h(d.audience==='class'?d.className:d.audience==='school'?'Verified families in this branch':'Active branch staff')} · ${a.rows.length} accounts</dd><dt>Channels</dt><dd>School portal${d.email?' + permitted email notifications':''}</dd><dt>Acknowledgement</dt><dd>${d.ack?'Requested by '+h(d.due):'Not requested'}</dd></dl>${w.teacher?'<div class="notice blue"><div><strong>The school office will review this draft.</strong><p>Your teacher role does not grant school-wide publishing.</p></div></div>':`<div class="field"><label for="c-when">Publish</label><select id="c-when" name="when"><option value="now" ${d.when==='now'?'selected':''}>Now</option><option value="later" ${d.when==='later'?'selected':''} ${d.replaces?'disabled':''}>At a scheduled time</option></select></div><div ${d.when!=='later'?'hidden':''}>${field('scheduled','Date and time · Asia/Kolkata','datetime-local')}</div>`}<label class="check"><input type="checkbox" name="reviewed" ${d.reviewed?'checked':''}>I have reviewed the message, audience, timing and acknowledgement.</label>${Object.values(w.errors).map(x=>`<p class="error" role="alert">${h(x)}</p>`).join('')}`;
 return head(d.replaces?'Publish a correction':w.teacher?'Prepare a class notice':'Create notice',`Greenwood · ${host.database().branch} · ${w.teacher?'Teacher draft → school approval':'School communication'}`)+`<ol class="comm-steps">${['Message','Recipients','Review'].map((x,i)=>`<li ${i===w.step?'aria-current="step"':''}><span>${i+1}</span>${x}</li>`).join('')}</ol><div class="comm-compose"><form id="notice-form" class="card" novalidate><h2>${['Write the notice','Choose the recipients','Review before publishing'][w.step]}</h2><div class="comm-fields">${body}</div><div class="form-foot">${button(w.step?'Back':'Cancel',w.step?'back':'cancel')}<button class="btn primary" type="submit">${w.step===2?(w.teacher?'Submit for approval':d.when==='later'?'Schedule notice':d.replaces?'Publish correction':'Publish notice'):'Continue'}${host.icon('arrow')}</button></div><div class="save-draft">${button('Save draft and leave','save-draft','',false,dirty()?'':'disabled')}</div></form><aside class="stack"><section class="card"><h2>A useful notice is clear</h2><p>Say what is happening, who it is for and what they need to do.</p><div class="section-divider"></div><h3>Only the right recipients</h3><p class="small">Approved school-notice permissions and current branch access determine who can read it.</p></section><section class="card"><h3>Need to attach a document?</h3><p class="small">Secure attachments and individual conversations follow in the next communication slice. This first cut supports text notices.</p></section></aside></div>`;

 function recipientPreview(a){return `<details class="comm-recipient-preview"><summary>Review eligible recipients ${host.icon('down')}</summary>${a.rows.length?`<ul>${a.rows.map(r=>`<li><strong>${h(r.name)}</strong><small>${h(r.scope)} · ${r.emailAllowed?'Verified email available':'In-app only'}</small></li>`).join('')}</ul>`:'<p>No eligible recipients yet.</p>'}<p class="hint">Excluded family details are not disclosed here. Use the authorized Family links workflow for verification.</p></details>`;}
 function submit(){if(!state.wizard)return;if(!validate()){host.render();return;}const w=state.wizard;if(w.step<2){w.step++;if(w.step===2)w.fingerprint=resolve(w.data).fingerprint;host.render();return;}const a=resolve(w.data);if(a.fingerprint!==w.fingerprint){w.errors.reviewed='The audience has changed. Review recipients again before publishing.';w.data.reviewed=false;w.step=1;host.render();return;}

  if(w.teacher){const existing=state.drafts.find(x=>x.id===w.id);const saved={...d,id:existing?.id||'DRAFT-'+Date.now(),owner:'teacher',author:'Ananya Rao',status:'Awaiting approval',version:(existing?.version||0)+1};if(existing)Object.assign(existing,saved);else state.drafts.push(saved);state.wizard=null;go('drafts');flash('Draft submitted to the school office. Nothing has been published.');return;}
  let n;if(d.replaces){n=notice(d.replaces);if(!n||n.status!=='Published'||n.version!==d.expectedNoticeVersion){w.errors.reviewed='The notice changed. Reopen its current version before correcting it.';host.render();return;}n.versions.push({version:n.version,title:n.title,body:n.body,recipients:JSON.parse(JSON.stringify(n.recipients)),publishedAt:n.publishedAt});Object.assign(n,d,{version:n.version+1,status:'Published',publishedAt:stamp(),recipients:a.rows.map(r=>makeRecipient(r,d)),excluded:a.excluded});dispatch(n);event(n,'Correction published; acknowledgement starts again for this version');}

 function deliveryLabel(r,n){if(r.suppressed||!liveRecipient(r))return'Access removed';if(!n.email)return'In-app only';if(!r.emailAllowed)return'In-app only';return r.attempts.at(-1)?.status||'Not queued';}
 function detail(id){const n=notice(id);if(!n)return empty('Notice unavailable','Choose a notice from this branch.',button('All notices','notices'));const current=n.recipients.filter(r=>!r.suppressed&&liveRecipient(r));return button('All notices','notices')+head(n.title,`${n.id} · Version ${n.version} · ${host.database().branch}`,status(n.status))+`<div class="comm-detail"><section class="card"><div class="comm-message-preview"><p>${h(n.body)}</p></div><dl class="kv"><dt>Publication</dt><dd>${h(n.status==='Scheduled'?n.scheduled+' · Asia/Kolkata':n.publishedAt||n.status)}</dd><dt>Acknowledgement</dt><dd>${n.ack?'Requested by '+h(n.due):'Not requested'}</dd><dt>Current version</dt><dd>${n.version}${n.versions.length?' · '+n.versions.length+' earlier version retained':''}</dd></dl><div class="head-actions comm-left">${n.versions.length?button('Earlier versions','versions',n.id):''}${n.status==='Published'?button('Publish correction','correct',n.id)+button('Withdraw notice','withdraw-review',n.id):n.status==='Scheduled'?button('Cancel schedule','cancel-schedule',n.id):''}</div></section><aside class="card"><h2>What happens next?</h2><p>${n.status==='Scheduled'?'The approved audience will be rechecked when publication is due. New recipients are not silently added.':n.status==='Withdrawn'?'The portal shows a withdrawal. Emails already sent cannot be recalled.':n.ack?'Follow up with recipients who have not acknowledged this version. Reading a notice alone does not count.':'Recipients can read the notice in their portal. No acknowledgement is required.'}</p><div class="section-divider"></div><h3>Current acknowledgement</h3><p class="comm-number">${n.ack?current.filter(r=>r.ackAt).length+' / '+current.length:'—'}</p><p class="hint">${n.ack?'Currently eligible recipient accounts; suppressed recipients are listed separately below.':'This notice does not request acknowledgement.'}</p>${n.status==='Published'&&n.ack?button('Remind pending recipients','remind-review',n.id):''}</aside></div><section class="card comm-space"><div class="card-title"><h2>Recipients & delivery</h2><small>${n.excluded} students lacked an eligible notice recipient at review</small></div><p class="hint">Provider accepted is email-service evidence. Read and acknowledged are separate portal actions.</p><div class="table-scroll"><table><caption class="sr">Recipient delivery, reading and acknowledgement</caption><thead><tr><th>Recipient</th><th>Email notification</th><th>Read</th><th>Acknowledgement</th><th>Follow up</th></tr></thead><tbody>${n.recipients.map((r,i)=>`<tr><td data-label="Recipient"><strong>${h(r.name)}</strong><small>${h(r.scope)}</small></td><td data-label="Email notification">${status(deliveryLabel(r,n))}</td><td data-label="Read">${r.readAt?'Read':'Not read'}</td><td data-label="Acknowledgement">${r.ackAt?h(r.ackMethod):n.ack?'Awaiting acknowledgement':'Not requested'}</td><td data-label="Follow up">${button('Details','view-recipient',n.id,false,`data-index="${i}"`)}</td></tr>`).join('')}</tbody></table></div></section><details class="card comm-space"><summary>Notice history</summary><ul class="timeline">${n.events.map(e=>`<li><strong>${h(e.text)}</strong><small>${h(e.time)}</small></li>`).join('')}</ul></details><div class="comm-preview-link">${button('Preview recipient inbox','recipient-preview',n.id)}<small>Fictional role preview · not real account impersonation</small></div>`;}
 function recipientDetail(id,index){const n=notice(id),r=n?.recipients[index];if(!r)return;const s=deliveryLabel(r,n),usable=liveRecipient(r)&&!r.suppressed&&n.status==='Published';modal('Recipient follow-up',`<h3>${h(r.name)}</h3><p>${h(r.scope)}</p><dl class="kv"><dt>Email notification</dt><dd>${h(s)}</dd><dt>Read</dt><dd>${h(r.readAt||'Not read')}</dd><dt>Acknowledgement</dt><dd>${h(r.ackAt?(r.ackMethod+' · '+r.ackAt):'No acknowledgement recorded')}</dd></dl><h3>Attempt history</h3><ul class="timeline">${r.attempts.map(a=>`<li><strong>${h(a.kind)} · ${h(a.status)}</strong><small>${h(a.time)} ${h(a.reason)}</small></li>`).join('')||'<li>No email notification requested.</li>'}</ul><p class="hint">Unknown delivery must be checked before retry. No contact address is changed here.</p>`,button('Close','close')+(usable&&s==='Failed'?button('Retry failed notification','retry',id,true,`data-index="${index}"`):'')+(usable&&s==='Unknown'?button('Check delivery status','check-status',id,true,`data-index="${index}"`):'')+(usable&&n.ack&&!r.ackAt?button('Record verified offline response','offline-review',id,false,`data-index="${index}"`):''));}
 function followup(){const ns=state.notices.filter(n=>n.status==='Published'&&n.recipients.some(r=>['Failed','Unknown'].includes(deliveryLabel(r,n))||n.ack&&!r.ackAt&&liveRecipient(r)));return head('Delivery & follow-up','Resolve known failures, check unknown delivery and follow up on pending acknowledgements.')+(ns.length?`<div class="stack">${ns.map(n=>`<section class="card"><div class="card-title"><h2>${h(n.title)}</h2>${button('Review recipients','open',n.id)}</div><p>${n.recipients.filter(r=>['Failed','Unknown'].includes(deliveryLabel(r,n))).length} email notifications need review · ${n.ack?n.recipients.filter(r=>liveRecipient(r)&&!r.ackAt).length:0} acknowledgements pending</p></section>`).join('')}</div>`:empty('Nothing needs follow-up','There are no unresolved notifications or pending acknowledgements in this branch.'));}

 function view(database,r){bind(database);const p=r.parts;if(p[0]==='flow'){const key=r.path;if(state.entry!==key){state.actor='admin';state.entry=key;if(p[1]==='SA-35'){state.wizard={data:draft(),step:0,errors:{},id:null,teacher:false};state.wizard.original=JSON.stringify(state.wizard.data);state.view='compose';}else state.view='follow-up';}}else{state.entry=null;state.view=p[1]||'notices';state.selected=p[2]||null;}

 function action(a,el){const id=el.dataset.id,index=Number(el.dataset.index),n=notice(id),r=n?.recipients[index];
  if(a==='close'){host.close();return;}

  if(a==='discard-draft'){modal('Discard this draft?','<p>This removes only the unpublished draft.</p>',button('Keep draft','close')+button('Discard draft','confirm-discard',id,true));return;}

 function input(target){if(!target?.closest('#notice-form'))return;capture();if(['audience','className','when','ack'].includes(target.name)){host.render();return;}const b=$('[data-action="comm-save-draft"]');if(b)b.disabled=!dirty();}
 return {configure(api){host=api},previewInbox(database,email){bind(database);state.actor='parent';state.identity=email;go('inbox');},view,action,submit,input,dirty,beforeLeave,clear(){if(state)state.wizard=null;},listRows(database){bind(database);return rows();},inspect(){return state;}};

function shell(body,crumb){const r=route();return `<div class="shell"><aside class="sidebar${S.menu?' open':''}" aria-label="School navigation"><a href="#/home" class="brand"><span class="mark">V</span>VSchool</a><div class="school-card"><strong>Greenwood Schools</strong><small>${h(db.branch)} · School workspace</small></div><nav class="nav-scroll"><div class="nav-caption">Workspace</div>${navItem('home')}${navItem('attendance')}${navItem('students')}${navItem('staff')}${navItem('academics')}${navItem('reports')}${S.mode==='expanded'?navItem('families')+navItem('communication')+navItem('planning','Timetable & daily changes','calendar'):''}<div class="nav-caption">Manage</div>${navItem('imports')}${navItem('settings')}${navItem('activity','Activity','clock')}${S.mode==='expanded'?`<details class="nav-group" ${module(r.parts[0])?.phase>1?'open':''}><summary>Enabled services ${icon('down')}</summary>${PACK.modules.filter(m=>m.phase>1&&!['families','communication','planning'].includes(m.id)).map(m=>navItem(m.id)).join('')}</details>`:''}</nav><div class="sidebar-footer"><div class="person"><span class="avatar">MI</span><div><strong>Meera Iyer</strong><small>${S.role==='specialist'?'Delegated service reviewer':'School administrator'}</small></div></div><div class="session-actions"><button class="signout" data-action="signout">${icon('logout')}Sign out</button></div></div></aside><div class="workspace"><div class="topbar"><button class="btn iconbtn mobile-menu" data-action="menu" aria-label="Open school navigation">${icon('menu')}</button><div class="crumb" aria-label="Breadcrumb">${crumb||h(module(r.parts[0])?.title||({activity:'Activity',setup:'School setup',drafts:'My drafts',journeys:'Workflow map'}[r.parts[0]])||'School workspace')}</div><div class="context-actions"><button class="context-btn" data-action="branch" aria-label="Switch branch, current ${h(db.branch)}">${icon('school')}${h(db.branch)}${icon('down')}</button><span class="top-year">2026–27</span></div></di function stat(label,value,hint,i){return `<div class="stat"><div class="label">${h(label)}${icon(i)}</div><strong>${h(value)}</strong><small>${h(hint)}</small></div>`;}
function home(){if(!db.students.length)return head('Welcome to Indiranagar','A focused setup path for your school’s Attendance pilot.',link('Start setup','setup',true,'arrow'))+notice('Your workspace is ready','Add branch records to begin. Whitefield’s students, staff and attendance are not shown here.','green')+setup(false);const mt=M.metrics(db.sessions);return head('A clear start to your school day','Thursday, 8 October 2026 · Whitefield',link('School setup','setup',false,'gear'))+`<div class="stats">${stat('Registers submitted',mt.submitted+' / '+mt.sessions,'Includes scheduled sessions','check')}${stat('Active students',db.students.filter(s=>s.status==='Active').length,'Across 3 classes','students')}${stat('Needs your attention','3','Attendance · import · staff access','bell')}</div><div class="grid"><div class="stack"><section class="card"><div class="card-title"><h2>Needs your attention</h2><span class="badge gold">3 items</span></div>${work('clock','English register not submitted','Grade 6 · A · 10:00–10:45 · Rohan Das','Open register','session/a4')}${work('upload','One roster row needs review','Grade 6 roster · IMP-1042 · 3 created, 1 unchanged','Review import','import/IMP-1042')}${work('people','Staff activation is pending','Nikhil Menon · School administrator access','Review access','staff/e4')}</section><section class="card"><div class="card-title"><h2>Your school, ready to run</h2><a href="#/setup">View setup ${icon('arrow')}</a></div><p class="muted small">Five foundations are ready. Review one staff activation.</p><div class="progress"><span style="width:83.33%"></span></div><div class="statusline">${badge('School settings ready')}${badge('Classes ready')}${badge('Enrollment ready')}</div></section></div><div class="stack"><section class="card"><div class="card-title"><h2>Today’s sessions</h2><a href="#/attendance" class="small">View all</a></div>${db.sessions.filter(s=>s.status!=='Submitted').map(s=>`<a class="schedule-item" href="#/session/${s.id}"><span class="schedule-time">${h(s.code.split('–')[0])}</span><div><strong>${h(s.name)}</strong><small>${h(s.class)} · ${h(s.teacher)}</small>${badge(s.status)}</div></a>`).join('')}</section><section class="card"><div class="card-title"><h2>Quick actions</h2></div><div class="stack" style="gap:8px">${flowLink('SA-18','Register a student')}${flowLink('SA-13','Add a staff profile')}${flowLink('SA-25','Schedule a session')}</div></section></div></div>`;}
function work(ic,title,sub,label,url){return `<div class="workrow"><span class="work-icon">${icon(ic)}</span><div class="body"><h3>${h(title)}</h3><p>${h(sub)}</p></div>${link(label,url,false,'arrow')}</div>`;}
function setup(withhead=true){const tasks=[['School information','Contact details, branch identity and time zone','SA-06'],['Academic year and calendar','Teaching dates, holidays and effective revisions','SA-09'],['Classes and subjects','Grades, sections and subject offerings','SA-10'],['Staff and teaching assignments','Verified identities and dated assignments','SA-16'],['Students and enrollment','Reviewed identities and valid class placements','SA-19'],['Attendance sessions','Offering, teacher and calendar checks','SA-25']];return (withhead?head('School setup','A dependency-aware checklist for Attendance. Optional services have their own setup.'):'')+`<section class="card">${tasks.map(([t,d,id],i)=>`<div class="checkrow">${icon(db.students.length&&i!==3?'check':'clock')}<div class="body"><strong>${h(t)}</strong><small>${h(d)}</small></div>${badge(!db.students.length?'Not started':i===3?'Review access':'Ready')}${link('Open','flow/'+id,false,'arrow')}</div>`).join('')}</section>`;}

ranch+'.',btn('Clear filters','clear-filters')))+`<div class="table-footer"><span>${filtered.length?(page-1)*size+1:0}–${Math.min(page*size,filtered.length)} of ${filtered.length} results</span><div class="pager">${btn('Previous','page',false,null,`data-page="${page-1}" ${page===1?'disabled':''}`)}${btn('Next','page',false,null,`data-page="${page+1}" ${page*size>=filtered.length?'disabled':''}`)}</div></div>`;}
function table(id,rows,cols){return `<div class="table-card mobile-cards"><div class="table-scroll"><table><caption class="sr">${h(tableConfig(id).title)} in ${h(db.branch)}</caption><thead><tr>${cols.map((x,i)=>`<th scope="col"${i===cols.length-1?' class="action-col"':''}>${h(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td data-label="${h(cols[0])}"><div class="personcell"><span class="avatar">${r.initials?h(r.initials):icon(module(id)?.icon||'file')}</span><div><a href="#/${recordRoute(id,r.id)}"><strong>${h(r.name)}</strong></a><div class="sub">${h(r.code)}</div></div></div></td><td data-label="${h(cols[1])}">${h(r.class)}${r.teacher?`<div class="sub">${h(r.teacher)}</div>`:''}</td><td data-label="${h(cols[2])}">${badge(r.status)}</td><td class="action-col"><button class="row-action" data-action="manage" data-scope="${id}" data-id="${h(r.id)}" aria-label="Manage ${h(r.name)}">${icon('sliders')}Manage</button></td></tr>`).join('')}</tbody></table></div></div>`;}
function recordRoute(id,rid){return id==='attendance'?'session/'+rid:id==='imports'?'import/'+rid:id==='academics'?'class/'+rid:id==='families'?'student/'+rid+'/family':id==='students'?'student/'+rid:id==='activity'?'event/'+rid:id+'/'+rid;}

="stack"><section class="card"><h2>Next actions</h2><p class="small">Keep changes in their owning workflow.</p><div class="stack" style="margin-top:16px;gap:8px">${flowLink('SA-19','Enroll student')}${flowLink('SA-21','Move to another class')}${S.mode==='expanded'?flowLink('SA-32','Link a parent or guardian'):''}</div></section><section class="card"><h2>Record history</h2><p class="small">Enrollment dates determine rosters. Changing this profile never rewrites submitted attendance.</p></section></aside></div>`);}

function staffDetail(id){const s=db.staff.find(x=>x.id===id);if(!s)return empty('Staff profile unavailable','Choose a record in your authorized branch.',link('Staff','staff'));return head(s.name,s.code+' · '+s.class,btn('Manage staff','manage',false,'sliders',`data-scope="staff" data-id="${id}"`))+`<div class="grid"><section class="card"><h2>Profile & access</h2><div class="section-divider"></div><dl class="kv"><dt>Employment</dt><dd>Active employee</dd><dt>Identity check</dt><dd>${badge(s.identity)}</dd><dt>Branch role</dt><dd>${h(s.role)}</dd><dt>Sign-in access</dt><dd>${badge(s.status)}</dd><dt>Teacher eligibility</dt><dd>${s.role==='Teacher'?'Dated eligibility required':'Not a teaching assignment'}</dd></dl><div class="section-divider"></div>${flowLink('SA-14','Manage sign-in access')}</section><aside class="stack">${s.status==='Pending activation'?notice('Activation is pending','Check delivery and expiry before resending. Email activation does not replace staff identity verification.','gold'):''}<section class="card"><h2>Keep the checks distinct</h2><p class="small">Employment, identity verification, account access, teacher eligibility and class assignment each answer a different question.</p><div class="stack" style="margin-top:18px;gap:8px">${flowLink('SA-15','Review invitation')}${flowLink('SA-16','Teacher eligibility')}${flowLink('SA-17','Change branch access')}</div></section></aside></div>`;}
function sessionDetail(id){const s=db.sessions.find(x=>x.id===id);if(!s)return empty('Session unavailable','This session is not visible in the current branch.',link('Attendance','attendance'));const roster=db.students.filter(x=>s.class===x.class);return head(s.name+' · '+s.class,'8 October 2026 · '+s.code+' · Asia/Kolkata',s.status==='Submitted'?link('Correct attendance','flow/SA-27',true,'edit'):link('Review session','flow/SA-28',false,'calendar'))+`<div class="statusline" style="margin-bottom:20px">${badge(s.status)}<span class="small muted">Assigned teacher: ${h(s.teacher)} · Revision ${s.version}</span></div>`+(s.status!=='Submitted'?notice('No submitted attendance yet','Only the assigned, eligible teacher can mark this session. No pupil has been recorded absent from this status.','gold'):'')+`<div class="table-card"><div class="table-scroll"><table><caption class="sr">${h(s.class)} session roster</caption><thead><tr><th scope="col">Student</th><th scope="col">Admission number</th><th scope="col">Attendance</th></tr></thead><tbody>${roster.map(st=>`<tr><th scope="row" style="background:white;color:var(--ink);font-size:13px;font-weight:550"><a href="#/student/${st.id}">${h(st.name)}</a></th><td>${h(st.code)}</td><td>${badge(s.records[st.id]||'Not recorded')}</td></tr>`).join('')}</tbody></table></div></div><div class="grid" style="margin-top:20px"><section class="card"><h2>Submission history</h2><p class="small">${s.status==='Submitted'?'Submitted by '+h(s.teacher)+' · 8 Oct. Original evidence is retained when a correction is recorded.':'No submission receipt. Scheduled and open sessions retain their own lifecycle.'}</p>${db.events.filter(e=>e.code==='SA-27').map(e=>`<div class="checkrow">${icon('clock')}<div class="body"><strong>${h(e.name)}</strong><small>${h(e.reason)} · ${h(e.id)}</small></div></div>`).join('')}</section><section class="card"><h2>Roster source</h2><p class="small">Enrollment and dated placements define eligibility. Opening a session freezes i h?Object.entries(s.records).map(([id,status])=>[db.branch,s.date,s.class,s.name,s.status,db.students.find(st=>st.id===id)?.code,status].map(csv).join(',')):[[db.branch,s.date,s.class,s.name,s.status,'','Not recorded'].map(csv).join(',')]).join('\n'));}else if(action==='reset-review'){S.modal={type:'reset'};modal('Reset the fictional review?',`<p style="margin-top:18px">This clears only the prototype’s in-memory changes and drafts. No real system is connected.</p>`,btn('Cancel','close')+btn('Reset review','confirm-reset',true));}else if(action==='confirm-reset')location.reload();}

  const dayIndex = date => (new Date(date+'T12:00:00Z').getUTCDay()+6)%7;
  const monday = date => addDays(date,-dayIndex(date));
  const minute = t => { if(!/^\d{2}:\d{2}$/.test(t)) fail('Enter a valid time.'); const [h,m]=t.split(':').map(Number);if(h>23||m>59)fail('Enter a valid time.');return h*60+m; };
  const overlap = (a,b) => minute(a.start)<minute(b.end)&&minute(b.start)<minute(a.end);

    {id:'p1',name:'Period 1',start:'09:00',end:'09:45',type:'Lesson'},
    {id:'p2',name:'Period 2',start:'09:45',end:'10:30',type:'Lesson'},

  ];
  function seed(){

    return {version:1,seq:25,now:'2026-10-08T11:00:00+05:30',org:'gw',branch:'Whitefield',zone:'Asia/Kolkata',year:'2026–27',
      module:{released:true,licensed:true,enabled:true,attendance:true},

      sessions:[{id:'2026-10-08|c1|p1',date:'2026-10-08',classId:'c1',periodId:'p1',status:'Submitted',teacher:'ananya',plan:'tv-1',marks:[{id:'s1',name:'Aarav Mehta',status:'Present'},{id:'s2',name:'Diya Shah',status:'Present'},{id:'s3',name:'Kabir Nair',status:'Absent'}]}]};
  }
  function authorize(db,ctx,write=false){
    if(!ctx||ctx.allowed===false||ctx.org!=='gw'||ctx.branch!==db.branch)fail('This timetable is not available in your current school context.');
    if(!db.module.released||!db.module.licensed||!db.module.enabled)fail('Timetable is not enabled for this branch.');

    if(ctx.role==='parent'&&!ctx.timetablePurpose)fail('Timetable access has not been granted for this child.');

  function name(db,type,id){return db[type].find(x=>x.id===id)?.name||'Unavailable';}

  function command(db,ctx,key,expected,kind,payload,apply){
    authorize(db,ctx,true);const fingerprint=JSON.stringify({kind,payload});const receipt=db.receipts.find(x=>x.key===key);

  function validate(db,p){
    const errors=[];
    if(!p.from||p.from<'2026-10-08'||p.from>'2027-03-31')errors.push('Choose an effective date within the remaining academic year.');
    if(!p.days.length)errors.push('Select at least one teaching day.');
    for(const q of p.periods){try{if(minute(q.start)>=minute(q.end))errors.push(q.name+': end time must follow start time.');}catch(e){errors.push(e.message);}}
    for(let i=0;i<p.periods.length;i++)for(let j=i+1;j<p.periods.length;j++)try{if(overlap(p.periods[i],p.periods[j]))errors.push(p.periods[i].name+' overlaps '+p.periods[j].name+'.');}catch{}

    for(let i=0;i<p.slots.length;i++)for(let j=i+1;j<p.slots.length;j++){
      const a=p.slots[i],b=p.slots[j],pa=p.periods.find(x=>x.id===a.periodId),pb=p.periods.find(x=>x.id===b.periodId);

    }

    function rowById(id){const [date,cl,p]=id.split('|');const r=M.occurrence(db,date,cl,p);if(!r)throw Error('This lesson is no longer available.');const list=M.rows(db,ctx(),M.monday(date),['parent','student'].includes(ctx().role)?ctx().classId:undefined);if(!list.some(x=>x.id===id))throw Error('This lesson is not available in your current scope.');return r;}
    function lesson(id){const r=rowById(id),c=ctx();state.selected=r.id;let content=kv([['Class',className(r.classId)],['Subject',r.subject],['Date',dateLabel(r.date)],['Time',r.start+'–'+r.end],['Teacher',teacherName(r.teacher)],['Room',roomName(r.room)],['Status',r.status],['Timetable','Revision '+db.plans.find(p=>p.id===r.plan)?.version]]);

    function editSlot(id,day,period){M.authorize(db,ctx(),true);const d=M.draft(db,ctx()),s=id?d.slots.find(x=>x.id===id):{id:'',classId:state.classId,day:Number(day),periodId:period,subject:'',teacher:'',room:''};if(!s)throw Error('Choose a draft lesson.');state.editId=s.id;

    function changes(){const c=ctx(),admin=c.role==='admin',all=M.rows(db,c,state.week,c.role==='teacher'?'':state.classId);let changes=db.changes.filter(x=>all.some(r=>r.id===x.occurrence));if(state.search)changes=changes.filter(x=>{const r=all.find(r=>r.id===x.occurrence);return String(state.attribute==='subject'?r?.subject:x.id).toLowerCase().includes(state.search.toLowerCase());});if(state.filters.length)changes=changes.filter(x=>state.filters.includes(x.type));changes.sort((a,b)=>String(state.sortBy==='date'?a.date:a.type).localeCompare(String(state.sortBy==='date'?b.date:b.type))*(state.order==='asc'?1:-1));

      if(admin){const reqs=db.requests.filter(r=>r.state==='Pending');out+=`<section class="tt-card" style="margin-top:20px"><h2>Teacher requests ${reqs.length?badge(reqs.length+' pending','warn'):''}</h2>${reqs.length?`<ul class="tt-list">${reqs.map(r=>`<li><strong>${teacherName(r.teacher)}</strong><p>${esc(r.message)}</p><div class="tt-actions" style="margin-top:10px">${b('Review request','review-request',false,'eye',`data-id="${r.id}"`)}</div></li>`).join('')}</ul>`:'<p>No requests are waiting for review.</p>'}</section>`;}
      if(c.role==='teacher'){const mine=db.requests.filter(r=>r.teacher===c.teacher);out+=`<section class="tt-card" style="margin-top:20px"><h2>My change requests</h2>${mine.length?`<ul class="tt-list">${mine.map(r=>`<li>${esc(r.message)}<small>${esc(r.state)}${r.response?' · '+esc(r.response):''}</small></li>`).join('')}</ul>`:'<p>You have no schedule requests in this review.</p>'}</section>`;}
      out+=`<section class="tt-card" style="margin-top:20px"><h2>Schedule notices</h2><p>${admin?'A published change queues one notice. Delivery does not prove that a person read it.':'Your timetable shows the latest schedule even when an email has not arrived.'}</p>${db.notices.length?`<ul class="tt-list">${db.notices.filter(n=>!n.occurrence||all.some(r=>r.id===n.occurrence)).map(n=>`<li>${esc(n.title)} <small>${dateLabel(n.date)}${admin?' · '+n.state:' · Published schedule update'}</small></li>`).join('')}</ul>`:'<p class="tt-muted">No schedule notices in this review yet.</p>'}</section>`;return out;

    function changeForm(type){const r=rowById(state.selected);state.changeType=type;state.commandKey=key();state.expected=db.version;let details=type==='Cover'?select('teacher','Substitute teacher',[['','Choose an eligible teacher'],...M.candidates(db,ctx(),r).filter(x=>x.eligible).map(x=>[x.id,x.name])],'','Only eligible teachers without a timetable clash are listed.')+`<ul class="tt-list">${M.candidates(db,ctx(),r).filter(x=>!x.eligible).map(x=>`<li>${x.name}<small>${x.reason}</small></li>`).join('')}</ul>`:type==='Move'?`<div class="tt-grid">${field('start','New start',r.start,'time')}${field('end','New end',r.end,'time')}${select('room','Room',db.rooms.map(x=>[x.id,x.name]),r.room)}</div>`:note('Cancel only this lesson','The weekly pattern stays unchanged. Notify affected users and follow the school’s supervision procedure.','warn');

      if(a==='mobile-day'){state.mobileDay=Number(t.dataset.value);rerender();return;}
      if(a==='tab'){discardGuard(()=>{state.tab=t.dataset.value;state.page='';state.draft=false;rerender();});return;}
      if(a==='draft'){M.draft(db,c);state.draft=true;state.page='';state.tab='week';state.week=M.monday(db.draft.from);state.classId=state.classId||'c1';rerender();}
      else if(a==='save-draft'){state.draftSaved=true;state.dirty=false;rerender();toast('Draft saved in this review. Published timetable unchanged.');}
      else if(a==='save-leave'){state.draftSaved=true;state.dirty=false;close();state.pendingLeave?.();}
      else if(a==='discard-draft'){db.draft=null;state.draft=false;state.dirty=false;close();state.pendingLeave?.();}
      else if(a==='published'){discardGuard(()=>{state.draft=false;state.page='';state.tab='week';rerender();});}
      else if(a==='changes'){state.draft=false;state.tab='changes';rerender();}
      else if(a==='prev'||a==='next'){state.week=M.addDays(state.week,a==='prev'?-7:7);rerender();}
      else if(a==='add-slot')editSlot(null,t.dataset.day,t.dataset.period);
      else if(a==='edit-slot')editSlot(t.dataset.id);
      else if(a==='remove-slot'){db.draft.slots=db.draft.slots.filter(s=>s.id!==t.dataset.id);state.dirty=true;state.draftSaved=false;close();rerender();}
      else if(a==='schoolday')schoolday();
      else if(a==='review')review();
      else if(a==='back-draft'){state.page='';state.draft=true;rerender();}
      else if(a==='lesson')lesson(t.dataset.id);
      else if(a==='new-change')newChange();
      else if(a==='restore-lesson')modal('Restore published lesson',`<form data-tt-form="restore">${note('Restore only this dated lesson','Existing change history remains. A clash or opened attendance will prevent restoration.','warn')}${field('reason','Operational reason','','textarea')}${foot('Restore lesson')}</form>`);
      else if(a.startsWith('change-'))changeForm({ 'change-cover':'Cover','change-move':'Move','change-cancel':'Cancel'}[a]);
      else if(a==='cover-yes'||a==='cover-no'){M.respondCover(db,c,t.dataset.id,a==='cover-yes');close();rerender();toast(a==='cover-yes'?'Cover acknowledged.':'Coordinator informed: the lesson needs cover.');}
      else if(a==='request')modal('Request a schedule change',`<form data-tt-form="request">${field('message','What does the coordinator need to know?','','textarea','Keep private staff information out of the handover.')}<p class="tt-muted" style="margin-top:12px">Your request does not change the published schedule.</p>${foot('Send request')}</form>`);
      else if(a==='review-request'){const r=db.requests.find(x=>x.id===t.dataset.id);state.requestId=r.id;state.selected=r.occurrence;modal('Review teacher request',kv([['Teacher',teacherName(r.teacher)],['Request',r.message]])+`<div class="tt-actions">${b('Arrange cover','change-cover',true,'people')}${b('Return with a note','return-request',false,'back')}</div>`);}
      else if(a==='return-request')modal('Return request',`<form data-tt-form="return-request">${field('note','Note to teacher','','textarea')}${foot('Return request')}</form>`);
      else if(a==='attendance')attendanceView();
      else if(a==='clock-to-lesson'){const r=rowById(state.selected);db.now=r.date+'T'+r.start+':00+05:30';toast('Fictional review clock advanced.');}
      else if(a==='open-roster'){M.attendance(db,c,state.selected,true);attendanceView();}
      else if(a==='principal-week'){state.page='principal-week';state.tab='week';rerender();}
      else if(a==='filters'){modal('Filters',`<form data-tt-form="filters"><details class="tt-drawer-group" open><summary>Change type ${icon('down')}</summary>${['Cover','Move','Cancel'].map(v=>`<label><input type="checkbox" name="types" value="${v}" ${state.filters.includes(v)?'checked':''}>${v}</label>`).join('')}</details>${foot('Apply')}</form>`,true);}
      else if(a==='sort'){modal('Sort',`<form data-tt-form="sort"><details class="tt-drawer-group" open><summary>Sort by ${icon('down')}</summary>${[['date','Lesson date'],['type','Change type']].map(([v,l])=>`<label><input type="radio" name="by" value="${v}" ${state.sortBy===v?'checked':''}>${l}</label>`).join('')}</details><details class="tt-drawer-group" open><summary>Order by ${icon('down')}</summary>${[['asc','Ascending'],['desc','Descending']].map(([v,l])=>`<label><input type="radio" name="order" value="${v}" ${state.order===v?'checked':''}>${l}</label>`).join('')}</details>${foot('Apply')}</form>`,true);}
      else if(a==='remove-filter'){state.filters=state.filters.filter(x=>x!==t.dataset.value);rerender();}
      else if(a.startsWith('preview-')){discardGuard(()=>{const role=a.replace('preview-','');state.preview={role:role==='cover'?'teacher':role,teacher:role==='cover'?'rohan':'ananya',classId:'c1',timetablePurpose:true,childName:'Aarav Mehta'};state.page='';state.tab='week';state.draft=false;close();rerender();});}
      else if(a==='end-preview'){state.preview=null;state.page='';state.tab='week';rerender();}
      else if(a==='reset'){db=M.seed();Object.assign(state,{page:'',tab:'week',preview:null,draft:false,dirty:false,draftSaved:false,unknown:null,receipt:null,error:''});close();rerender();toast('Timetable example reset. Other module data is unchanged.');}
      else if(a==='unknown-next'){state.failNext=true;toast('The next publication will simulate a lost acknowledgement.');}
      else if(a==='check-status'){const r=db.receipts.find(x=>x.key===state.commandKey);if(!r)throw Error('No final result is available yet. Keep this command reference.');state.unknown=null;state.receipt={...r.result,title:'Timetable published'};rerender();}
      else if(a==='license'||a==='activation'){if(context.role!=='operator'||context.readOnly)throw Error('Module configuration permission is required.');state.configAction=a;modal(a==='license'?'Change timetable license':'Change branch activation',`<form data-tt-form="config">${note('Review the impact',a==='license'?'Removing the license disables timetable access. Adding it does not activate the branch.':'This changes Timetable only for the selected branch. Attendance licensing and records remain separate.','warn')}${field('reason','Reason','','textarea')}${a==='license'?field('approval','Agreement / approval reference'):''}<label class="tt-check"><input name="confirm" type="checkbox" required>I have reviewed this configuration change.</label>${foot('Confirm change')}</form>`);}
    }
    function submit(form){const fd=new FormData(form),v=Object.fromEntries(fd),type=form.dataset.ttForm,c=ctx();
      if(type==='slot'){M.putSlot(db,c,{id:state.editId,classId:state.classId,day:Number(v.day),periodId:v.periodId,subject:v.subject,teacher:v.teacher,room:v.room});state.dirty=true;state.draftSaved=false;close();rerender();}
      else if(type==='schoolday'){const d=M.copy(db.draft);d.from=v.from;d.days=fd.getAll('days').map(Number);d.periods.forEach(p=>{p.start=v[p.id+'-start'];p.end=v[p.id+'-end'];});const errors=M.validate(db,d);if(errors.length)throw Error(errors.join(' '));db.draft=d;state.week=M.monday(d.from);state.dirty=true;state.draftSaved=false;close();rerender();}
      else if(type==='publish'){if(!v.confirm)throw Error('Confirm that you reviewed the impact.');const from=db.draft.from;const result=M.publish(db,c,state.commandKey,state.expected);state.receipt={...result,title:'Timetable published'};state.page='receipt';state.dirty=false;state.draft=false;state.week=M.monday(from);if(state.failNext){state.unknown=true;state.failNext=false;}rerender();}
      else if(type==='restore'){M.restore(db,c,state.selected,v.reason);close();rerender();toast('Published lesson restored; change history retained.');}
      else if(type==='choose-change'){state.selected=v.occurrence;changeForm(v.type);}
      else if(type==='change'){if(!v.confirm)throw Error('Confirm that you reviewed this change.');const r=rowById(state.selected),payload={date:r.date,classId:r.classId,periodId:r.periodId,type:state.changeType,reason:v.reason,...(state.changeType==='Cover'?{teacher:v.teacher}:state.changeType==='Move'?{start:v.start,end:v.end,room:v.room}:{})};const res=M.change(db,c,state.commandKey,state.expected,payload);if(state.requestId){const req=db.requests.find(x=>x.id===state.requestId);if(req?.occurrence===r.id)req.state='Resolved by '+res.reference;state.requestId=null;}close();state.tab='changes';rerender();toast('Dated change saved. The weekly pattern is unchanged.');}
      else if(type==='request'){M.request(db,c,rowById(state.selected),v.message);close();rerender();toast('Request sent to the school timetable coordinator.');}
      else if(type==='return-request'){M.authorize(db,c,true);const req=db.requests.find(x=>x.id===state.requestId);if(!v.note.trim())throw Error('Add a note.');req.state='Returned';req.response=v.note;close();rerender();toast('Request returned with a note.');}
      else if(type==='attendance'){M.submitAttendance(db,c,state.selected,v);attendanceView();toast('Attendance submitted in this review.');}
      else if(type==='search'){state.search=v.search.trim();state.attribute=v.attribute;rerender();}
      else if(type==='filters'){state.filters=fd.getAll('types');close();rerender();}
      else if(type==='sort'){state.sortBy=v.by;state.order=v.order;close();rerender();}
      else if(type==='config'){if(context.role!=='operator'||context.readOnly||!v.reason.trim()||!v.confirm)throw Error('Authorized confirmation and a reason are required.');if(state.configAction==='license'){if(!v.approval.trim())throw Error('Add an agreement reference.');db.module.licensed=!db.module.licensed;if(!db.module.licensed){db.module.enabled=false;Object.keys(state.opBranches).forEach(k=>state.opBranches[k]=false);}}else{if(!db.module.licensed||!db.module.released)throw Error('License and release prerequisites must be met first.');const branch=context.branches?.find(b=>b.id===state.opBranch);if(!db.module.enabled&&branch&&(!branch.ready||branch.status!=='Active'))throw Error('The selected branch must be active and setup-ready.');db.module.enabled=!db.module.enabled;state.opBranches[state.opBranch]=db.module.enabled;}db.audit.push({kind:'Timetable configuration changed',reason:v.reason});close();rerender();toast('Fictional timetable configuration updated.');}
    }
    document.addEventListener('click',e=>{const t=e.target.closest('[data-tt]');if(t){e.preventDefault();e.stopImmediatePropagation();guarded(()=>action(t.dataset.tt,t));return;}const link=e.target.closest('a[href]');if(link&&state.dirty&&!state.draftSaved&&host?.isConnected){e.preventDefault();e.stopImmediatePropagation();discardGuard(()=>{location.href=link.href;});}},true);
    document.addEventListener('submit',e=>{if(!e.target.matches('[data-tt-form]'))return;e.preventDefault();e.stopImmediatePropagation();guarded(()=>submit(e.target));},true);
    document.addEventListener('change',e=>{const t=e.target;if(!t.dataset.ttField)return;e.stopImmediatePropagation();guarded(()=>{if(t.dataset.ttField==='opbranch')state.opBranch=t.value;if(t.dataset.ttField==='class')state.classId=t.value;if(t.dataset.ttField==='week'){if(!t.value)throw Error('Choose a valid week.');state.week=M.monday(t.value);}rerender();});},true);
    window.addEventListener('beforeunload',e=>{if(state.dirty&&!state.draftSaved){e.preventDefault();e.returnValue='';}});
    return {render,mount,state,get db(){return db;},get context(){return context;},action,lesson,close,model:M};
  }
  return {create,icon};
})();
