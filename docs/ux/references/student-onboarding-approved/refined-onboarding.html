/* Alternative B: a single paper-like working surface, unchanged Forest palette. */
:root{--paper:#fff;--canvas:#f5f7f3}
.work{background:var(--canvas)}
.topbar{background:var(--paper)}
main{max-width:1080px;padding:26px 44px 44px}
.heading{margin-bottom:22px;max-width:884px}
h1{font-size:28px;letter-spacing:-.75px;font-weight:650}
.back{margin-bottom:12px}
.form-surface{max-width:884px;background:var(--paper);border:1px solid #e0e7dd;border-radius:12px;padding:4px 30px 0;box-shadow:0 3px 12px #183e3303;overflow:hidden}
.section{grid-template-columns:154px minmax(0,1fr);gap:22px;padding:26px 0;border-top:1px solid #e7ece4}
.section:first-of-type{border-top:0}
.section-label h2{font-size:14px;letter-spacing:-.1px}
.section-label .optional{font-size:10px;margin-top:5px}
.fields{gap:18px 18px}
input,select{border-color:#d5ded3;border-radius:6px}
.field label{font-weight:550;font-size:12px}
input::placeholder{color:#9aa59b}
.form-actions{margin:0 -30px;padding:18px 30px;background:#fafbf8;border-top:1px solid #e4ebe0}
.form-actions>button:not(.primary){border-color:transparent;background:transparent;color:var(--muted)}
.form-actions .primary{min-width:116px}
.profile-layout{max-width:884px;background:var(--paper);border:1px solid #e0e7dd;border-radius:12px;padding:28px 30px 0;overflow:hidden;box-shadow:0 3px 12px #183e3303}
.profile-header{margin-bottom:24px}
.profile-header .avatar{width:54px;height:54px;border-radius:50%;font-size:18px;background:#e9f1e5}
.profile-header h1{font-size:26px;letter-spacing:-.7px}
.profile-header .meta{margin-top:5px;font-size:11px}
.profile-header .head-action{font-size:12px}
.profile-strip{background:transparent;border:0;border-top:1px solid #e7ece4;border-bottom:1px solid #e7ece4;border-radius:0;padding:19px 0;margin:0;grid-template-columns:1.2fr 1fr 1fr}
.profile-strip>div{border-right:1px solid #e7ece4;padding-right:18px}
.profile-strip>div:last-child{border-right:0}
.profile-strip dt{font-size:11px;margin-bottom:5px}
.profile-strip dd{font-size:13px;font-weight:550}
.profile-section{padding:24px 0;border-top:1px solid #e7ece4}
.profile-section:first-of-type{border-top:0}
.profile-section:last-child{background:#fafbf8;margin:0 -30px;padding:20px 30px}
.profile-section:last-child .section-title-row{margin-bottom:4px}
.section-title-row h2{font-size:14px}
.section-title-row button{font-size:12px}
#add-guardian{padding:6px 11px;border:1px solid #d5ded3;border-radius:6px;background:white;min-height:34px;font-size:12px}
#add-guardian:hover{background:var(--pale)}
#add-guardian svg{width:15px;height:15px}
.facts{grid-template-columns:1.2fr 1fr;gap:18px}
.facts dd{font-size:12px}
.guardian-row{align-items:center;padding:18px 0}
.guardian-row>.tag{font-size:10px}
.guardian-avatar{width:36px;height:36px;font-size:11px;background:#f0f3ed}
.guardian-name{font-size:13px}
.guardian-info p{font-size:12px;margin-top:3px}
.guardian-tools{gap:16px;margin-top:4px}
.guardian-tools button{min-height:28px;font-size:11px}
.guardian-info{padding-right:12px}
.drawer{width:470px;box-shadow:-16px 0 70px #183e331c}
.drawer-head{background:#fafcf8;padding:27px 28px 22px}
.drawer-body{padding:26px 28px}
.drawer-foot{background:#fafcf8;padding:18px 28px max(18px,env(safe-area-inset-bottom))}
.drawer-head h2{font-size:21px}
.purpose{padding-top:22px;margin-top:24px}
.purpose .check{min-height:32px;margin:6px 0;align-items:center}
.mockbar{max-width:884px;margin-top:26px}
.variant-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px 18px;background:#edf2e9;border-bottom:1px solid #dce5d6;color:#687c71;font-size:10px}
.variant-nav span{margin-right:10px}
.variant-nav a{color:#566d5c;text-decoration:none;padding:4px 9px;border-radius:4px;min-height:28px;display:inline-flex;align-items:center}
.variant-nav a.current{background:white;color:#236b53;box-shadow:0 1px 4px #183e3308}
.variant-nav a:hover{background:white}

/* Student profile revision: one identity header, three meaningful sections. */

.record-identity{display:flex;gap:16px;align-items:center;padding:3px 0 25px}
.record-identity .avatar{width:56px;height:56px;border-radius:50%;font-size:18px;background:#e4edde;color:#4d7251;border:1px solid #dbe6d5}
.identity-copy{min-width:0;flex:1}.identity-name{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.identity-name h1{font-size:28px;line-height:36px;letter-spacing:-.7px}.identity-name .tag{font-size:10px;padding:2px 7px}
.identity-copy p{font-size:12px;color:var(--muted);margin-top:5px}.identity-edit{font-size:12px;min-height:36px;background:#fff}
.record-body{background:white;border:1px solid #dfe6dc;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px #183e3303}
.record-section{padding:24px 28px;border-bottom:1px solid #e6ebe3}
.record-section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:19px;min-height:36px}
.record-section-head h2{font-size:15px;font-weight:600;letter-spacing:-.15px}.record-section-head button{font-size:12px}.record-section-head button svg{width:15px;height:15px}
.record-facts{display:grid;grid-template-columns:1.25fr 1fr .8fr 1.1fr;gap:20px;margin:0;padding:0 0 3px}
.record-facts dt{font-size:11px;color:var(--muted);margin-bottom:7px}.record-facts dd{font-size:13px;line-height:21px;font-weight:500;margin:0;overflow-wrap:anywhere}
.family-section .record-section-head{margin-bottom:20px}.family-section #add-guardian{font-size:12px;background:#fff;border:1px solid #d5ded3;min-height:34px;padding:6px 11px}
.family-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0;border-top:1px solid #edf0ea}
.family-row:first-child{padding-top:0;border:0}.family-row:last-child{padding-bottom:0}
.family-person{display:flex;align-items:center;gap:12px;min-width:0}.family-identity{min-width:0}.family-identity p{color:var(--muted);font-size:12px;margin-top:5px;overflow-wrap:anywhere}.family-identity .family-failure{color:#906127;font-size:11px}
.family-person .guardian-avatar{width:38px;height:38px;border-radius:50%;background:#f0f3ec;font-size:11px;flex-shrink:0}
.family-person .guardian-name{font-size:13px;gap:9px}.family-person .guardian-name small{font-size:11px;color:var(--muted)}

@media(max-width:700px){.record-identity{padding:0 0 20px;gap:12px;flex-wrap:wrap}.record-identity .avatar{width:46px;height:46px;font-size:16px}.identity-name{gap:8px}.identity-name h1{font-size:24px;line-height:32px}.identity-copy p{font-size:11px;margin-top:3px}.identity-edit{min-height:44px;margin-left:58px;padding:6px 10px;font-size:11px}.record-section{padding:20px 18px}.record-section-head{gap:8px;margin-bottom:18px}.record-section-head h2{font-size:14px}.record-section-head button{font-size:11px;min-height:44px}.record-facts{gap:19px 14px}.record-facts dt{font-size:11px;margin-bottom:5px}.record-facts dd{font-size:13px}.family-section #add-guardian{font-size:11px;min-height:44px;padding:6px 9px}.family-section .record-section-head{margin-bottom:16px}.family-row{display:block;padding:18px 0}.family-access{margin-left:50px;margin-top:8px;flex-direction:row;justify-content:space-between;align-items:center;gap:10px}.family-access .text{min-height:44px;font-size:12px}.family-access .tag{white-space:normal;line-height:18px}.family-person{align-items:flex-start}.family-person .guardian-name{gap:6px}.family-person .guardian-name small{font-size:11px}.record-access{padding:17px 18px;gap:10px}.record-access>button{font-size:11px;min-height:44px}.access-symbol{display:none}.identity-name .tag{font-size:10px}}

</style></head><body>
<div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">v</span>VSchool</div><nav id="mainnav" aria-label="School administration"></nav><div class="sidebottom"><nav><button data-out="Settings" data-icon="settings">Settings</button></nav><div class="user"><span class="user-avatar">AS</span><div>Alex Shah<small>School administrator</small></div></div><nav><button data-out="Sign out" data-icon="logout">Sign out</button></nav></div></aside><div class="work"><div class="variant-nav" aria-label="Compare design concepts"><span>CONCEPT COMPARISON</span><a href="connected-onboarding.html#add">Original</a><a class="current" href="refined-onboarding.html#add" aria-current="page">Refined alternative</a></div><header class="topbar"><button class="icon mobilemenu" id="open-menu" aria-label="Open navigation" data-icon="menu"></button><strong>Students</strong><div class="context"><span>Greenwood School</span><span class="subtle-divider">/</span><span>Main branch</span></div></header><main><div id="screen"></div><div class="mockbar"><strong>Design review</strong><button id="show-add">Add Student</button><button id="show-profile">Student profile</button><button id="show-guardian">Guardian drawer</button><select id="outcome" aria-label="Simulated invitation outcome"><option value="success">Invitation: sent</option><option value="failed">Invitation: delivery failed</option></select><p>Refined alternative · fictional data · no records saved or emails sent. Refresh resets changes.</p></div></main></div></div>
<dialog class="drawer" id="guardian-drawer" aria-labelledby="drawer-title"></dialog><dialog class="modal" id="confirm" aria-labelledby="confirm-title"></dialog><dialog class="mobile-nav" id="mobile-nav" aria-label="School navigation"><div class="close"><button class="icon" id="close-menu" aria-label="Close navigation" data-icon="close"></button></div><div class="brand">VSchool</div><nav id="mobile-links"></nav></dialog><div id="toast" class="toast hidden" role="status"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paths={home:'M3 10 12 3l9 7v11H3z M9 21v-8h6v8',students:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M17 4a4 4 0 0 1 0 8 M22 21v-2a4 4 0 0 0-3-3.87',staff:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M17 10h5 M19.5 7.5v5',attendance:'M9 3h6v4H9z M9 5H5v16h14V5h-4 M8 14l3 3 5-6',academic:'m2 8 10-5 10 5-10 5z M6 10v7c4 3 8 3 12 0v-7 M22 8v8',message:'M4 4h16v13H8l-4 4z M8 8h8 M8 12h5',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2',logout:'M10 3H4v18h6 M10 12h11 M17 8l4 4-4 4',menu:'M4 6h16 M4 12h16 M4 18h16',close:'m6 6 12 12 M6 18 18 6',arrow:'m9 5-7 7 7 7 M2 12h18',plus:'M12 5v14 M5 12h14',check:'m5 12 4 4 10-10',edit:'m16 3 5 5-12 12-6 1 1-6z M14 5l5 5',mail:'M3 5h18v14H3z m0 0 9 7 9-7',alert:'m12 3 10 18H2z M12 9v5 M12 17h.01'};
const ico=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.check}"/></svg>`;
const nav=[['Today','home'],['Students','students'],['Staff','staff'],['Attendance','attendance'],['Academics','academic'],['Communication','message']];
$('#mainnav').innerHTML=nav.map(([n,i])=>`<button class="${n==='Students'?'active':''}" ${n==='Students'?'aria-current="page"':''} data-out="${n}">${ico(i)}${n}</button>`).join('');$('#mobile-links').innerHTML=$('#mainnav').innerHTML;document.querySelectorAll('[data-icon]').forEach(b=>b.insertAdjacentHTML('afterbegin',ico(b.dataset.icon)));
let student={name:'Mira Shah',admission:'GW-2026-0142',date:'2026-10-21',year:'2026–27',section:'Grade 6 · A',roll:'18'},guardians=[{name:'Priya Shah',relation:'Mother',email:'priya.shah@example.com',access:'Enabled',purposes:['Summary','Attendance','Timetable']}],page='add',trigger=null,editing=-1;
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),4200)}
function setRoute(p){history.pushState({},'',`#${p}`);renderRoute()}
function field(id,label,value='',type='text',extra=''){return `<div class="field ${extra}"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" value="${esc(value)}"><p class="error-text" id="${id}-error"></p></div>`}
function addPage(){page='add';$('#screen').innerHTML=`<button class="back" id="back-profile">${ico('arrow')}Students</button><div class="heading"><div><h1>Add student</h1></div><button class="text" id="existing-demo">Use existing record</button></div><form id="add-form" class="form-surface" novalidate><div id="form-error" role="alert"></div><section class="section"><div class="section-label"><h2>Student</h2></div><div class="section-content"><div class="fields">${field('first','First name','Mira')}${field('last','Last name','Shah')}${field('admission','Admission number','GW-2026-0142')}${field('admitted','Admission date','2026-10-21','date')}</div></div></section><section class="section"><div class="section-label"><h2>Class placement</h2></div><div class="section-content"><div class="fields"><div class="field"><label for="year">Academic year</label><select id="year"><option>2026–27</option><option>2027–28</option></select></div><div class="field"><label for="class">Class & section</label><select id="class"><option value="">Assign later</option><option selected>Grade 6 · A</option><option>Grade 6 · B</option><option>Grade 7 · A</option></select></div></div><details class="disclosure"><summary>Placement dates & roll number</summary><div class="fields">${field('effective','Effective from','2026-10-21','date')}${field('roll','Roll number <span>Optional</span>','18')}</div></details></div></section><section class="section"><div class="section-label"><h2>Parent / guardian</h2><span class="optional">Optional</span></div><div class="section-content"><div class="fields">${field('guardian-name','Full name','Priya Shah')}<div class="field"><label for="relationship">Relationship</label><select id="relationship"><option>Mother</option><option>Father</option><option>Guardian</option></select></div>${field('guardian-email','Email address','priya.shah@example.com','email','full')}</div><label class="check subsection"><input id="invite" type="checkbox">Send a parent portal invitation</label><details class="disclosure hidden" id="access-details"><summary>Portal access</summary><div class="fields"><label class="check"><input type="checkbox" class="initial-purpose" value="Summary" checked>Child summary</label><label class="check"><input type="checkbox" class="initial-purpose" value="Attendance" checked>Attendance</label><label class="check"><input type="checkbox" class="initial-purpose" value="Timetable" checked>Timetable</label></div></details></div></section><footer class="form-actions"><button type="button" id="cancel-add">Cancel</button><button class="primary" type="submit">Add student</button></footer></form>`;
$('#back-profile').onclick=$('#cancel-add').onclick=()=>setRoute('profile');$('#existing-demo').onclick=()=>toast('Existing-record lookup stays in the accepted VSchool flow; this mock focuses on new intake.');$('#invite').onchange=()=>$('#access-details').classList.toggle('hidden',!$('#invite').checked);$('#add-form').onsubmit=saveNew;
}
function saveNew(e){e.preventDefault();document.querySelectorAll('[aria-invalid]').forEach(x=>x.removeAttribute('aria-invalid'));document.querySelectorAll('.error-text').forEach(x=>x.textContent='');let errors=[];const required=[['first','Enter a first name.'],['admission','Enter an admission number.'],['admitted','Choose an admission date.']];required.forEach(([id,msg])=>{if(!$('#'+id).value.trim())errors.push([id,msg])});if($('#admitted').value>'2026-10-21')errors.push(['admitted','Choose 21 October 2026 or an earlier date.']);if($('#invite').checked&&!$('#guardian-name').value.trim())errors.push(['guardian-name','Enter the guardian’s name.']);if($('#invite').checked&&!$('#guardian-email').value.trim())errors.push(['guardian-email','Enter an email address.']);if($('#guardian-email').value&&!$('#guardian-email').validity.valid)errors.push(['guardian-email','Enter a valid email address.']);if(errors.length){errors.forEach(([id,msg])=>{$('#'+id).setAttribute('aria-invalid','true');$('#'+id).setAttribute('aria-describedby',id+'-error');$('#'+id+'-error').textContent=msg});$('#form-error').innerHTML='<div class="notice error">Check the highlighted fields.</div>';$('#'+errors[0][0]).focus();return}student={name:$('#first').value.trim()+' '+$('#last').value.trim(),admission:$('#admission').value,date:$('#admitted').value,year:$('#year').value,section:$('#class').value,roll:$('#roll').value};guardians=[];if($('#guardian-name').value.trim()){guardians.push({name:$('#guardian-name').value.trim(),relation:$('#relationship').value,email:$('#guardian-email').value,access:$('#invite').checked?($('#outcome').value==='failed'?'Delivery failed':'Invited'):'Not invited',purposes:[...document.querySelectorAll('.initial-purpose:checked')].map(x=>x.value)})}setRoute('profile');$('#profile-notice').innerHTML=`<div class="notice">${ico('check')}<div><strong>Student added</strong><p>${student.section?esc(student.section)+' · '+esc(student.year):'Class placement can be completed later.'}</p></div></div>`;$('#profile-heading').focus();}
function profilePage(){page='profile';$('#screen').innerHTML=`<button class="back" id="back-add">${ico('arrow')}Students</button><div id="profile-notice" aria-live="polite"></div><div class="student-record"><header class="record-identity"><div class="avatar">${esc(student.name.split(' ').filter(Boolean).map(x=>x[0]).slice(0,2).join(''))}</div><div class="identity-copy"><div class="identity-name"><h1 id="profile-heading" tabindex="-1">${esc(student.name)}</h1><span class="tag"><span class="badge"></span>Active</span></div><p>Admission no. ${esc(student.admission)}</p></div><button class="identity-edit" id="edit-student">${ico('edit')}Edit student</button></header><div class="record-body"><section class="record-section"><div class="record-section-head"><h2>School record</h2><button class="text" id="placement">${ico('edit')}${student.section?'Edit placement':'Assign class'}</button></div><dl class="record-facts"><div><dt>Class & section</dt><dd>${esc(student.section||'Not assigned')}</dd></div><div><dt>Academic year</dt><dd>${esc(student.year)}</dd></div><div><dt>Roll number</dt><dd>${esc(student.roll||'—')}</dd></div><div><dt>Admission date</dt><dd>${formatDate(student.date)}</dd></div></dl></section><section class="record-section family-section"><div class="record-section-head"><h2>Parents & guardians</h2><button id="add-guardian">${ico('plus')}Add guardian</button></div><div id="guardians"></div></section><section class="record-access"><div class="access-label"><span class="access-symbol">${ico('students')}</span><div><h2>Student portal</h2><p>Not enabled</p></div></div><button class="text" id="student-portal">Set up access <span aria-hidden="true">→</span></button></section></div></div>`;$('#back-add').onclick=()=>setRoute('add');$('#edit-student').onclick=()=>toast('Detail correction uses the existing authorized workflow; outside this mock.');$('#placement').onclick=openPlacement;$('#student-portal').onclick=()=>toast('Student portal setup remains a separate authorized action; outside this mock.');$('#add-guardian').onclick=e=>openGuardian(e.currentTarget);renderGuardians();}
function formatDate(v){if(!v)return '—';return new Date(v+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function renderGuardians(){$('#guardians').innerHTML=guardians.length?guardians.map((g,i)=>`<div class="family-row"><div class="family-person"><div class="guardian-avatar">${esc(g.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</div><div class="family-identity"><div class="guardian-name">${esc(g.name)}<small>${esc(g.relation)}</small></div><p>${esc(g.email||'No email added')}</p>${g.access==='Delivery failed'?'<p class="family-failure">Invitation could not be delivered.</p>':''}</div></div><div class="family-access"><span class="tag ${g.access==='Enabled'?'':'pending'}">${g.access==='Enabled'?'Portal access enabled':esc(g.access)}</span><button class="text" data-edit="${i}">${g.access==='Delivery failed'?'Review & resend':'Manage'}<span aria-hidden="true">→</span></button></div></div>`).join(''):'<div class="family-empty">No guardians added.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openGuardian(b,+b.dataset.edit));}
function openGuardian(opener,index=-1){trigger=opener||$('#show-guardian');editing=index;const g=index>=0?guardians[index]:{name:'',relation:'Mother',email:'',purposes:['Summary','Attendance','Timetable']};const d=$('#guardian-drawer');d.innerHTML=`<div class="drawer-head"><div><h2 id="drawer-title">${index<0?'Add guardian':'Manage guardian access'}</h2><p>${esc(student.name)} <span class="subtle-divider">·</span> ${esc(student.section||student.admission)}</p></div><button class="icon" id="close-drawer" aria-label="Close guardian panel">${ico('close')}</button></div><form id="guardian-form" style="display:contents" novalidate><div class="drawer-body"><div class="fields">${field('g-name','Full name',g.name,'text','full')}<div class="field full"><label for="g-relation">Relationship</label><select id="g-relation">${['Mother','Father','Guardian'].map(n=>`<option ${g.relation===n?'selected':''}>${n}</option>`).join('')}</select></div>${field('g-email','Email address',g.email,'email','full')}</div><div class="purpose"><h3>Portal access</h3>${['Summary','Attendance','Timetable'].map(n=>`<label class="check"><input class="g-purpose" type="checkbox" value="${n}" ${g.purposes.includes(n)?'checked':''}>${n==='Summary'?'Child summary':n}</label>`).join('')}</div>${index>=0?`<div class="purpose"><button class="text danger" type="button" id="remove-guardian">Remove access</button></div>`:''}<p id="guardian-error" class="error-text" role="alert"></p></div><footer class="drawer-foot"><button type="button" id="cancel-guardian">Cancel</button><button class="primary" type="submit">${index>=0&&g.access==='Enabled'?'Save changes':'Add & send invitation'}</button></footer></form>`;$('#close-drawer').onclick=$('#cancel-guardian').onclick=()=>d.close();d.onclose=()=>{if(trigger?.isConnected)trigger.focus()};$('#guardian-form').onsubmit=e=>{e.preventDefault();const name=$('#g-name').value.trim(),email=$('#g-email').value.trim(),purposes=[...document.querySelectorAll('.g-purpose:checked')].map(x=>x.value);if(!name||!email||!$('#g-email').validity.valid||!purposes.length){$('#guardian-error').textContent='Enter a name, valid email and at least one access choice.';(!name?$('#g-name'):!email||!$('#g-email').validity.valid?$('#g-email'):$('.g-purpose')).focus();return}const updated={name,email,relation:$('#g-relation').value,purposes,access:index>=0&&g.access==='Enabled'?'Enabled':$('#outcome').value==='failed'?'Delivery failed':'Invited'};if(index<0)guardians.push(updated);else guardians[index]=updated;d.close();renderGuardians();$('#add-guardian').focus();toast(updated.access==='Delivery failed'?'Guardian saved. Invitation delivery failed.':updated.access==='Enabled'?'Guardian access updated.':'Guardian added. Invitation sent.');};if(index>=0)$('#remove-guardian').onclick=()=>{d.close();confirmRemoval(index)};d.showModal();$('#g-name').focus();}
function confirmRemoval(index){const d=$('#confirm');d.innerHTML=`<h2 id="confirm-title">Remove guardian access?</h2><p>${esc(guardians[index].name)} will lose portal access to ${esc(student.name)}. Other child links are unaffected.</p><footer><button id="keep-access">Keep access</button><button class="danger" id="remove-access">Remove access</button></footer>`;$('#keep-access').onclick=()=>d.close();$('#remove-access').onclick=()=>{guardians[index].access='Not invited';guardians[index].purposes=[];d.close();renderGuardians();$('#add-guardian').focus();toast('Guardian access removed.');};d.showModal();$('#keep-access').focus();}
function openPlacement(){const d=$('#confirm');d.innerHTML=`<h2 id="confirm-title">Class placement</h2><p style="margin-bottom:18px">${esc(student.name)}</p><div class="field"><label for="new-section">Class & section</label><select id="new-section">${['Grade 6 · A','Grade 6 · B','Grade 7 · A'].map(s=>`<option ${s===student.section?'selected':''}>${s}</option>`).join('')}</select></div><p style="font-size:11px;margin-top:14px">Preview only. Production placement changes retain dated history and roster-impact review.</p><footer><button id="cancel-placement">Cancel</button><button class="primary" id="save-placement">Preview placement</button></footer>`;$('#cancel-placement').onclick=()=>d.close();$('#save-placement').onclick=()=>{student.section=$('#new-section').value;d.close();profilePage();toast('Mock placement updated.');};d.showModal();}
function renderRoute(){const route=location.hash.slice(1);if(route==='profile'||route==='guardian')profilePage();else addPage();$('#show-add').classList.toggle('selected',page==='add');$('#show-profile').classList.toggle('selected',page==='profile');if(route==='guardian')openGuardian($('#show-guardian'));}
$('#show-add').onclick=()=>setRoute('add');$('#show-profile').onclick=()=>setRoute('profile');$('#show-guardian').onclick=()=>setRoute('guardian');window.onpopstate=()=>{$('#guardian-drawer').close();renderRoute()};document.querySelectorAll('[data-out]').forEach(b=>b.onclick=()=>{if($('#mobile-nav').open)$('#mobile-nav').close();if(b.dataset.out==='Students')setRoute('profile');else toast(b.dataset.out+' is outside this onboarding mock.');});$('#open-menu').onclick=()=>$('#mobile-nav').showModal();$('#close-menu').onclick=()=>$('#mobile-nav').close();renderRoute();
</script></body></html>
