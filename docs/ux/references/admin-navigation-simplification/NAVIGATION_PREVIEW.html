<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VSchool · Administrator navigation proposal</title>
<style>
:root{--ink:#243a32;--muted:#687970;--green:#24634e;--green-dark:#194b3a;--line:#e1e8e3;--bg:#f6f8f5;--soft:#edf4ed;--focus:#81b39a;font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}*{box-sizing:border-box}body{margin:0;background:var(--bg)}button,input,select{font:inherit;color:inherit}button,a{touch-action:manipulation}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none}.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:232px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}.sidebar-head{padding:26px 18px 12px}.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:750;letter-spacing:-1px;text-decoration:none;color:var(--ink);padding:0 10px}.mark{display:grid;place-items:center;width:35px;height:35px;border-radius:10px;background:var(--green);color:#fff;font-weight:600}.school{margin:20px 10px 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.school strong,.school span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.school strong{font-size:13px}.school span{font-size:11px;color:var(--muted);margin-top:4px}.nav-scroll{min-height:0;overflow:auto;padding:12px 18px 20px;overscroll-behavior:contain}.nav-label{margin:16px 10px 7px;font-size:10px;letter-spacing:1.45px;text-transform:uppercase;color:#89968e;font-weight:650}.nav{display:grid;gap:5px}.nav a,.nav button{width:100%;display:flex;align-items:center;gap:13px;min-height:44px;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:#65766d;text-decoration:none;text-align:left;font-weight:520;cursor:pointer}.nav a:hover,.nav button:hover{background:#f3f6f2}.nav a.active{background:var(--soft);color:#245b43;font-weight:650}.conditional{border-top:1px solid var(--line);margin-top:16px;padding-top:8px}.sidebar-foot{margin-top:auto;border-top:1px solid var(--line);background:#fff;padding:12px 18px 16px}.identity{display:flex;align-items:center;gap:10px;min-height:48px;padding:5px 10px;color:var(--ink);text-decoration:none;border-radius:8px}.avatar{display:grid;place-items:center;width:34px;height:34px;border:1px solid #dce5db;border-radius:50%;background:#e8eee7;font-size:11px;font-weight:650}.identity strong,.identity small{display:block;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.identity strong{font-size:12px}.identity small{font-size:11px;color:var(--muted);margin-top:3px}.signout{margin-top:5px}.workspace{grid-column:2;min-width:0}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:#ffffffc7;border-bottom:1px solid var(--line);gap:18px}.context{display:flex;align-items:center;gap:11px}.context-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--soft);color:var(--green)}.context strong,.context small{display:block}.context strong{font-size:13px}.context small{font-size:11px;color:var(--muted);margin-top:3px}.year{font-size:12px;color:var(--muted)}.menu,.close{display:none}.content{max-width:1130px;margin:auto;padding:30px 48px 60px}.preview-note{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:12px 14px;margin-bottom:22px;border:1px solid #d9e4da;border-radius:8px;background:#f0f6f0}.preview-note p{margin:0;font-size:12px}.preview-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.preview-controls label{font-size:11px;font-weight:650}.preview-controls select{min-height:36px;border:1px solid #cdd7d0;border-radius:6px;background:#fff;padding:7px 30px 7px 10px;font-size:12px}.breadcrumb{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin:0 0 18px}.page-head{margin-bottom:22px}.page-head h1{font-size:28px;line-height:36px;letter-spacing:-.8px;margin:0;font-weight:650}.page-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.local-nav{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--line);margin:0 0 24px;padding:0 0 1px}.local-nav button{min-height:40px;white-space:nowrap;border:0;border-bottom:2px solid transparent;background:transparent;padding:8px 12px;color:var(--muted);font-weight:550;cursor:pointer}.local-nav button[aria-current=page]{border-color:var(--green);color:var(--green)}.form-card{max-width:740px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 3px 12px #243a3203}.form-body{padding:28px 30px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.section-head h2{font-size:16px;letter-spacing:-.25px;margin:0}.text-action{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--green);min-height:36px;padding:7px 0;font-size:13px;font-weight:550;cursor:pointer}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}.field label{display:block;font-size:12px;line-height:18px;font-weight:600;margin-bottom:7px}.optional{font-size:11px;color:#8a958e;font-weight:400;margin-left:4px}.field input{display:block;width:100%;min-height:40px;border:1px solid #cdd7d0;border-radius:6px;background:#fff;padding:9px 11px}.rule{border:0;border-top:1px solid var(--line);margin:26px 0}.help{margin-top:12px;color:var(--muted);font-size:12px}.help summary{display:inline-flex;align-items:center;gap:6px;cursor:pointer;list-style:none}.help p{max-width:450px;margin:8px 0 0}.form-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 30px;border-top:1px solid var(--line);background:#fcfdfb}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.primary:hover{background:var(--green-dark)}.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}.sample-panel{max-width:740px;padding:22px 24px;border:1px solid var(--line);border-radius:12px;background:#fff}.sample-panel h2{font-size:17px;margin:0 0 6px}.sample-panel p{color:var(--muted);margin:0 0 18px}.sample-rows{display:grid}.sample-row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;border-top:1px solid var(--line);padding:10px 0}.sample-row:first-child{border-top:0}.sample-row strong,.sample-row span{display:block}.sample-row span{font-size:12px;color:var(--muted);margin-top:3px}.sample-row button{white-space:nowrap}.empty{padding:28px 0;color:var(--muted)}.backdrop{display:none;position:fixed;inset:0;background:#172b2455;z-index:15}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:min(90vw,520px);background:var(--ink);color:#fff;border-radius:8px;padding:12px 16px;z-index:40;font-size:13px}.hidden{display:none!important}
@media(max-width:1000px) and (min-width:768px){.shell{grid-template-columns:210px minmax(0,1fr)}.sidebar{width:210px}.content{padding:28px}.topbar{padding:0 28px}}
@media(max-width:767px){.shell{display:block}.workspace{grid-column:auto}.sidebar{width:260px;transform:translateX(-100%);transition:transform .18s}.sidebar.open{transform:translateX(0)}.backdrop.open{display:block}.menu,.close{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:transparent}.close{position:absolute;right:12px;top:18px}.sidebar-head{padding-top:24px}.brand{padding-right:42px}.topbar{height:68px;padding:0 16px;justify-content:flex-start}.year{display:none}.content{padding:24px 18px 40px}.preview-note{display:block}.preview-controls{margin-top:10px}.page-head h1{font-size:25px;line-height:32px}.local-nav{margin-inline:-4px}.local-nav button{min-height:44px}.form-body{padding:22px 20px}.grid{grid-template-columns:1fr;gap:18px}.form-foot{padding:16px 20px}.btn,.text-action{min-height:44px}.sample-row{align-items:flex-start;flex-direction:column}.sample-row button{align-self:stretch}}
</style>
</head>
<body>
<div class="backdrop" id="backdrop"></div>
<div class="shell">
 <aside class="sidebar" id="sidebar" aria-label="School administrator menu">
  <div class="sidebar-head"><a class="brand" href="#today"><span class="mark">v</span><span>vschool.</span></a><button class="close" id="close" aria-label="Close navigation"></button><div class="school"><strong>Willowbank School</strong><span>North Campus</span></div></div>
  <div class="nav-scroll"><div class="nav-label">Workspace</div><nav class="nav" id="primary" aria-label="Proposed Administrator navigation"></nav><div id="services"></div></div>
  <footer class="sidebar-foot"><nav class="nav" aria-label="Utilities"><a href="#settings" data-area="settings" data-icon="settings">Settings</a></nav><a class="identity" href="#account" data-area="account"><span class="avatar">AN</span><span><strong>Ananya Nair</strong><small>School administrator</small></span></a><div class="nav signout"><button type="button" id="signout" data-icon="exit">Sign out</button></div></footer>
 </aside>
 <section class="workspace"><header class="topbar"><button class="menu" id="menu" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar"></button><div class="context"><span class="context-mark" data-icon="school"></span><span><strong>Willowbank School</strong><small>North Campus</small></span></div><span class="year">Academic year&nbsp; <strong>2026–27</strong></span></header><main class="content" id="main" tabindex="-1"></main></section>
</div>
<div class="toast hidden" id="toast" role="status"></div>
<script>
const paths={home:'M3 10l9-7 9 7v10H3z M9 20v-7h6v7',students:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M17 4a4 4 0 0 1 0 8 M22 21v-2a4 4 0 0 0-3-3.87',staff:'M8 6V4h8v2 M3 7h18v13H3z M3 12l9 3 9-3 M10 14h4',attendance:'M9 11l3 3 9-10 M20 12v8H4V4h11',academics:'M12 5v16 M12 5C8 2 3 3 3 3v16s5-1 9 2c4-3 9-2 9-2V3s-5-1-9 2',communication:'M21 3H3v14h4v4l5-4h9z M7 8h10 M7 12h6',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z',services:'M4 7h16v13H4z M8 7V4h8v3 M4 12h16',exit:'M9 4H4v16h5 M10 12h11 M17 8l4 4-4 4',menu:'M4 6h16 M4 12h16 M4 18h16',close:'M5 5l14 14 M19 5 5 19',school:'M3 21V9l9-6 9 6v12z M9 21v-6h6v6 M7 10h1 M16 10h1',arrow:'M5 12h14 M14 7l5 5-5 5',info:'M12 11v6 M12 7h.01 M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20'};
const icon=n=>`<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="${paths[n]||paths.home}"/></svg>`;
document.querySelectorAll('[data-icon]').forEach(node=>node.insertAdjacentHTML('afterbegin',icon(node.dataset.icon)));
document.querySelector('#menu').innerHTML=icon('menu');document.querySelector('#close').innerHTML=icon('close');
const profiles={
 broad:{label:'Broad Administrator',areas:['today','students','staff','attendance','academics','communication'],services:['facilities','finance','support'],locals:{staff:['Profiles','Access','Availability'],attendance:['Registers','Explanations','Corrections','Report'],academics:['Timetable','Classes & subjects','Teaching assignments','Assessments','Cover']}},
 attendance:{label:'Attendance-only branch (simulated)',areas:['attendance'],services:[],locals:{attendance:['Registers','Explanations','Corrections','Report']}},
 noAccess:{label:'No staff-access management (simulated)',areas:['today','students','staff','attendance','academics','communication'],services:[],locals:{staff:['Profiles','Availability']}},
 noTimetable:{label:'Academics, no Timetable (simulated)',areas:['today','students','staff','attendance','academics'],services:[],locals:{academics:['Classes & subjects','Teaching assignments','Assessments']}},
 noCommunication:{label:'Communication unavailable (simulated)',areas:['today','students','staff','attendance','academics'],services:[],locals:{}},
 services:{label:'Conditional service access (simulated)',areas:['today','students'],services:['facilities','support'],locals:{}},
 newSchool:{label:'New school, setup incomplete (simulated)',areas:['today'],services:[],locals:{}}
};
const areas={today:['Today','home'],students:['Students','students'],staff:['Staff','staff'],attendance:['Attendance','attendance'],academics:['Academics','academics'],communication:['Communication','communication'],settings:['Settings','settings'],account:['Account','staff']};
const defaultLocals={students:['Directory','Admissions','Imports'],staff:['Profiles','Access','Availability'],attendance:['Registers','Explanations','Corrections','Report'],academics:['Timetable','Classes & subjects','Teaching assignments','Assessments','Cover'],communication:['Notices','Calendar'],settings:['Setup','School details','Modules','Appearance','Activity']};
let profile='broad',area=(location.hash||'#students').slice(1),local='Directory',lastOpener=null;
const primary=document.querySelector('#primary'),services=document.querySelector('#services'),main=document.querySelector('#main'),sidebar=document.querySelector('#sidebar'),menu=document.querySelector('#menu'),backdrop=document.querySelector('#backdrop');
function toast(message){const node=document.querySelector('#toast');node.textContent=message;node.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.classList.add('hidden'),3200)}
function openNav(){lastOpener=document.activeElement;sidebar.classList.add('open');backdrop.classList.add('open');menu.setAttribute('aria-expanded','true');document.body.style.overflow='hidden';requestAnimationFrame(()=>sidebar.querySelector('a,button')?.focus())}
function closeNav(restore=true){sidebar.classList.remove('open');backdrop.classList.remove('open');menu.setAttribute('aria-expanded','false');document.body.style.overflow='';if(restore)requestAnimationFrame(()=>lastOpener?.focus())}
menu.onclick=openNav;document.querySelector('#close').onclick=()=>closeNav();backdrop.onclick=()=>closeNav();document.querySelector('#signout').onclick=()=>toast('Design preview only. Production sign out remains a separate guarded action.');
document.addEventListener('keydown',event=>{if(!sidebar.classList.contains('open'))return;if(event.key==='Escape'){event.preventDefault();closeNav();return}if(event.key!=='Tab')return;const items=[...sidebar.querySelectorAll('a,button')].filter(node=>node.getClientRects().length);const first=items[0],last=items.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}});
function nav(){const p=profiles[profile];if(!p.areas.includes(area)&&!['settings','account'].includes(area))area=p.areas[0]||'settings';primary.innerHTML=p.areas.map(id=>`<a href="#${id}" data-area="${id}" class="${area===id?'active':''}" ${area===id?'aria-current="page"':''}>${icon(areas[id][1])}<span>${areas[id][0]}</span></a>`).join('');services.innerHTML=p.services.length?`<div class="conditional"><div class="nav-label">School services</div><nav class="nav" aria-label="Conditional school services">${p.services.map(id=>`<a href="#${id}" data-service="${id}">${icon('services')}<span>${id==='facilities'?'Facilities':id==='finance'?'Finance':'Restricted support'}</span></a>`).join('')}</nav></div>`:'';document.querySelectorAll('[data-area]').forEach(link=>link.classList.toggle('active',link.dataset.area===area));document.querySelectorAll('#primary a,[data-area]').forEach(link=>link.onclick=()=>{area=link.dataset.area;local=(defaultLocals[area]||[])[0]||'';render();if(innerWidth<768)closeNav(false)});document.querySelectorAll('[data-service]').forEach(link=>link.onclick=event=>{event.preventDefault();toast(`${link.textContent.trim()} is a direct conditional destination. This preview performs no owner action.`);if(innerWidth<768)closeNav(false)});}
function localNav(){const permitted=profiles[profile].locals?.[area]||defaultLocals[area]||[];if(!permitted.length)return'';if(!permitted.includes(local))local=permitted[0];return `<nav class="local-nav" aria-label="${areas[area]?.[0]} views">${permitted.map(label=>`<button type="button" data-local="${label}" ${local===label?'aria-current="page"':''}>${label}</button>`).join('')}</nav>`}
function registration(){return `<section class="form-card" aria-label="Accepted registration composition"><div class="form-body"><div class="section-head"><h2>Student details</h2><button class="text-action" type="button" data-preview>Use an existing record ${icon('arrow')}</button></div><div class="grid"><div class="field"><label for="first">First name *</label><input id="first"></div><div class="field"><label for="last">Last name <span class="optional">Optional</span></label><input id="last"></div></div><hr class="rule"><div class="section-head"><h2>Admission details</h2></div><div class="grid"><div class="field"><label for="number">Admission number *</label><input id="number"></div><div class="field"><label for="date">Admission date *</label><input id="date" type="date"></div></div><details class="help"><summary>${icon('info')}Which admission date should I use?</summary><p>Use the verified date the student first joined this branch. It cannot be a future date.</p></details></div><footer class="form-foot"><button class="btn quiet" type="button" data-preview>Cancel</button><button class="btn primary" type="button" data-preview>Register student ${icon('arrow')}</button></footer></section>`}
function rows(title,description,items){return `<section class="sample-panel"><h2>${title}</h2><p>${description}</p><div class="sample-rows">${items.map(([a,b,c])=>`<div class="sample-row"><div><strong>${a}</strong><span>${b}</span></div><button class="btn" type="button" data-preview>${c}</button></div>`).join('')}</div></section>`}
function body(){if(area==='students'&&local==='Directory')return registration();if(area==='attendance')return rows('Attendance monitoring','The preferred entry is the existing monitor view, not scheduling.',[['Grade 8 · Mathematics','09:00 · Submitted','Review'],['Grade 7 · Science','09:45 · Scheduled','Open register']]);if(area==='academics'){const items=profile==='noTimetable'?[['Grade 8 · A','Current class and Teacher assignment','Open class'],['Assessment planning','Current authorized cycle','Review']]:[['Published timetable','Effective 19 October 2026','Review timetable'],['Grade 8 · A','Current class and Teacher assignment','Open class']];return rows(local||'Academics','Only currently authorized academic destinations appear.',items)}if(area==='today')return rows('Current work','Requests and assigned follow-ups appear only after their owner probes succeed.',[['Assigned follow-up','Attendance evidence requires review','Open'],['School request','One request awaits a response','Review']]);if(area==='staff')return rows(local||'Staff','Profiles, access and availability retain separate owner checks.',[['Avery Example','Teaching staff · Active','Manage']]);if(area==='communication')return rows(local||'Communication','Notices and Calendar remain independently authorized.',[['Term update','Published to the authorized audience','View']]);if(area==='settings')return rows(local||'Settings','Configuration destinations keep their current grants and version checks.',[['School details','North Campus','Open'],['Appearance','Forest · published','Review']]);if(area==='account')return rows('My account','Account remains a separate utility.',[['Current session','This browser','Review sessions']]);return `<section class="sample-panel"><h2>Destination unavailable in this preview</h2><p>The production route remains guarded by its owner.</p></section>`}
function render(){nav();const p=profiles[profile],name=areas[area]?.[0]||'School service';main.innerHTML=`<section class="preview-note"><p><strong>Design reference</strong><br>Fictional data. No domain mutation is performed. Non-broad profiles are contract simulations.</p><div class="preview-controls"><label for="profile">Access profile</label><select id="profile">${Object.entries(profiles).map(([id,value])=>`<option value="${id}" ${id===profile?'selected':''}>${value.label}</option>`).join('')}</select></div></section><p class="breadcrumb">School administration / ${name}</p><header class="page-head"><h1>${name}</h1><p>${area==='students'?'Find a Student and continue with the right school-office action.':area==='attendance'?'Monitor registers and review exceptions.':area==='academics'?'Plan classes, teaching and the published timetable.':'A direct, authorized workspace destination.'}</p></header>${localNav()}${body()}`;document.querySelector('#profile').onchange=event=>{profile=event.target.value;local='';render()};document.querySelectorAll('[data-local]').forEach(button=>button.onclick=()=>{local=button.dataset.local;render()});document.querySelectorAll('[data-preview]').forEach(button=>button.onclick=()=>toast('Design preview only. Production validation and authorization are unchanged.'));history.replaceState(null,'',`#${area}`);}
window.addEventListener('hashchange',()=>{area=location.hash.slice(1)||'today';local='';render()});render();
</script>
</body>
</html>
