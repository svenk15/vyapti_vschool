function navigation(){const p=profiles[profile];primary.innerHTML=p.areas.map(id=>`<a href="${hrefFor(id)}" data-nav class="${area===id?'active':''}" ${area===id?'aria-current="page"':''}>${icons[destinations[id].icon]}<span>${destinations[id].label}</span></a>`).join('');services.innerHTML=p.services.length?`<div class="conditional"><div class="nav-label">School services</div><nav class="nav" aria-label="Conditional school services">${p.services.map(id=>`<a href="#service/${id}" data-service>${icons.services}<span>${id==='facilities'?'Facilities':id==='finance'?'Finance':'Restricted support'}</span></a>`).join('')}</nav></div>`:'';document.querySelectorAll('[data-area]').forEach(link=>link.classList.toggle('active',link.dataset.area===area));document.querySelectorAll('[data-nav],[data-area]').forEach(link=>link.onclick=event=>{event.preventDefault();navigate(link.getAttribute('href'));if(innerWidth<768)closeNav(false)});document.querySelectorAll('[data-service]').forEach(link=>link.onclick=event=>{event.preventDefault();showToast('Conditional owner destination only. No action runs in this preview.')})}
function secondary(){const available=profiles[profile].locals?.[area]||[];if(available.length<2)return'';return `<div class="secondary-wrap"><nav class="secondary-nav" aria-label="${destinations[area].label} destinations">${available.map(([label,id])=>`<a href="#${area}/${id}" data-local ${local===id?'aria-current="page"':''}>${label}</a>`).join('')}</nav></div>`}function registerAction(){if(area!=='students'||local==='register')return'';if(local==='directory'&&profiles[profile].registration)return `<a class="primary-action" href="#students/register" data-register>${icons.plus}Register student</a>`;if(local==='admissions')return `<button class="primary-action" type="button" data-preview>${icons.plus}New application</button>`;if(local==='imports')return `<button class="primary-action" type="button" data-preview>${icons.plus}New import</button>`;return''}
function directory(){const desktop=rows.map(([initials,name,number,grade])=>`<tr><td><span class="person"><span class="student-avatar">${initials}</span>${name}</span></td><td>${number}</td><td>${grade}</td><td><span class="status">Active</span></td><td><a class="manage" href="#student/${number}" data-preview>Manage →</a></td></tr>`).join('');const mobile=rows.map(([initials,name,number,grade])=>`<article class="student-card"><span class="person"><span class="student-avatar">${initials}</span>${name}</span><dl><dt>Admission</dt><dd>${number}</dd><dt>Class</dt><dd>${grade}</dd><dt>Status</dt><dd>Active</dd></dl><a class="manage" href="#student/${number}" data-preview>Manage →</a></article>`).join('');return `<div class="toolbar"><label class="search"><select aria-label="Search attribute"><option>Student name</option><option>Admission number</option></select><span class="search-divider"></span><input aria-label="Search students" placeholder="Search students…"></label><button class="control" type="button" data-preview>${icons.filter}Filters</button><button class="control" type="button" data-preview>${icons.sort}Sort</button></div><table class="directory"><thead><tr><th>Student</th><th>Admission number</th><th>Class</th><th>Status</th><th><span class="hidden">Actions</span></th></tr></thead><tbody>${desktop}</tbody></table><div class="mobile-cards">${mobile}</div><div class="table-foot"><span>4 students</span><span class="pager"><button type="button" disabled>Previous</button><button type="button" data-preview>Next</button></span></div>`}
function areaTable(kind){const content={admissions:{title:'Admission applications',description:'Applications stay in their existing authorized destination.',action:'New application',headers:['Applicant','Submitted','Status',''],rows:[['Diya Kapoor','18 Oct 2026','In review','Review'],['Nikhil Joshi','17 Oct 2026','Ready for decision','Open']]},imports:{title:'Import history',description:'Existing history and reconciliation remain available.',action:'New import',headers:['File','Created','Outcome',''],rows:[['grade-6-roster.csv','18 Oct 2026','Needs review','Review'],['new-starters.csv','15 Oct 2026','Completed','Open']]},profiles:{title:'Staff profiles',description:'Profiles remain separate from access and availability.',action:'Add staff',headers:['Staff member','Role','Status',''],rows:[['Avery Example','Teacher','Active','Manage'],['Riya Sen','School office','Active','Manage']]},access:{title:'Staff access',description:'Membership and invitations retain their current checks.',action:'Invite staff',headers:['Account','Access','Status',''],rows:[['avery.teacher@example.test','Teacher','Active','Manage'],['riya.office@example.test','Administrator','Invitation pending','Review']]},availability:{title:'Staff availability',description:'Dated availability stays under the People owner.',action:'Record availability',headers:['Staff member','Date','Status',''],rows:[['Avery Example','20 Oct 2026','Available','Review'],['Riya Sen','20 Oct 2026','Unavailable','Review']]}}[kind];if(!content)return generic(kind);return `<header class="panel-head"><div><h2>${content.title}</h2><p>${content.description}</p></div><button class="control" type="button" data-preview>${icons.plus}${content.action}</button></header><table class="open-table"><thead><tr>${content.headers.map(value=>`<th>${value}</th>`).join('')}</tr></thead><tbody>${content.rows.map(row=>`<tr>${row.map((value,index)=>`<td data-label="${content.headers[index]||'Action'}">${index===row.length-1?`<a class="row-action" href="#action" data-preview>${value} →</a>`:value}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function generic(id){return `<header class="panel-head"><div><h2>${(profiles[profile].locals?.[area]||[]).find(([,value])=>value===id)?.[0]||destinations[area]?.label||'Destination'}</h2><p>This preview keeps the current owner route, authority and behavior.</p></div></header><div class="empty">The selected destination is represented without inventing product data or actions.</div>`}
function registration(){return `<section class="registration"><a class="back" href="#students/directory" data-local>← Back to Students</a><div class="registration-card"><div class="registration-body"><h2>Student details</h2><div class="form-grid"><div class="field"><label for="first">First name *</label><input id="first"></div><div class="field"><label for="last">Last name <span class="quiet">Optional</span></label><input id="last"></div><div class="field"><label for="number">Admission number *</label><input id="number"></div><div class="field"><label for="date">Admission date *</label><input id="date" type="date"></div></div></div><footer class="registration-foot"><button class="quiet-btn" type="button" data-preview>Cancel</button><button class="primary-action" type="button" data-preview>Register student</button></footer></div></section>`}
function body(){if(area==='students'&&local==='register')return registration();if(area==='students'&&local==='directory')return directory();if(area==='students'||area==='staff')return areaTable(local);return generic(local||area)}
function render(){navigation();const isRegister=area==='students'&&local==='register',available=profiles[profile].locals?.[area]||[];const title=isRegister?'Register student':available.length===1?`${destinations[area]?.label||''} ${available[0][0]}`.trim():destinations[area]?.label||'School service';main.innerHTML=`<h1 class="page-title">${title}</h1>${isRegister?'':`<div class="workspace-nav-row">${secondary()}${registerAction()}</div>`}${body()}`;document.querySelectorAll('[data-local],[data-register]').forEach(link=>link.onclick=event=>{event.preventDefault();navigate(link.getAttribute('href'))});document.querySelectorAll('[data-preview]').forEach(node=>node.onclick=event=>{event.preventDefault();showToast('Preview only. Production behavior and authorization are unchanged.')});requestAnimationFrame(()=>document.querySelector('.secondary-nav [aria-current="page"]')?.scrollIntoView({block:'nearest',inline:'nearest'}))}
function showToast(message){const toast=document.querySelector('#toast');toast.textContent=message;toast.classList.remove('hidden');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.add('hidden'),2600)}function openNav(){lastFocus=document.activeElement;sidebar.classList.add('open');backdrop.classList.add('open');menu.setAttribute('aria-expanded','true');document.body.style.overflow='hidden';document.querySelector('#close').focus()}function closeNav(restore=true){sidebar.classList.remove('open');backdrop.classList.remove('open');menu.setAttribute('aria-expanded','false');document.body.style.overflow='';if(restore)(lastFocus||menu).focus()}
menu.onclick=openNav;document.querySelector('#close').onclick=()=>closeNav();backdrop.onclick=()=>closeNav();document.querySelector('#signout').onclick=()=>showToast('Sign out remains a separate production utility.');document.addEventListener('keydown',event=>{if(event.key==='Escape'&&sidebar.classList.contains('open'))closeNav();if(event.key==='Tab'&&sidebar.classList.contains('open')){const focusable=[...sidebar.querySelectorAll('a,button')].filter(node=>!node.hasAttribute('disabled'));const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
const profileSelect=document.querySelector('#profile');profileSelect.innerHTML=Object.entries(profiles).map(([id,value])=>`<option value="${id}" ${id===profile?'selected':''}>${value.label}</option>`).join('');profileSelect.onchange=event=>{profile=event.target.value;const params=new URLSearchParams(location.search);params.set('profile',profile);history.replaceState(null,'',`${location.pathname}?${params}#students/directory`);parseLocation();render()};document.querySelector('#theme').onchange=event=>document.documentElement.dataset.theme=event.target.value;addEventListener('popstate',()=>{parseLocation();render()});addEventListener('hashchange',()=>{parseLocation();render()});parseLocation();render();
</script>
</body>
</html>
